name: iPhone and iPad preflight
on:
  workflow_dispatch:
  push:
    branches: [main, 'work/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        family: [iPhone, iPad]
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Select available simulator
        env:
          DEVICE_FAMILY: ${{ matrix.family }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '--json']))['devices']
          matching = [d for runtime, rows in devices.items() if 'iOS' in runtime for d in rows if d['name'].startswith(os.environ['DEVICE_FAMILY'])]
          if not matching:
              raise SystemExit('Required simulator family is unavailable')
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write('SIMULATOR_ID=' + matching[0]['udid'] + '\n')
          PY
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test -project Hashiya.xcodeproj -scheme Hashiya -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO | tee build.log
      - name: Export UI screenshots
        if: always()
        run: |
          if [ -d TestResults.xcresult ]; then
            xcrun xcresulttool export attachments --path TestResults.xcresult --output-path Screenshots
          fi
      - name: Save diagnostics and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.family }}
          path: |
            build.log
            Screenshots/*.png
            Screenshots/*.txt
            Screenshots/*.json
          retention-days: 7

  device-package:
    # A device package is a candidate only after both simulator suites pass.
    needs: test
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build unsigned device app
        run: |
          set -o pipefail
          xcodebuild -project Hashiya.xcodeproj -scheme Hashiya -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath DeviceBuild CODE_SIGNING_ALLOWED=NO build | tee device-build.log
      - name: Package for external signing
        run: |
          mkdir -p Payload
          cp -R DeviceBuild/Build/Products/Release-iphoneos/Hashiya.app Payload/
          zip -qry Hashiya-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Hashiya-device-unsigned
          path: Hashiya-unsigned.ipa
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: device-build-log
          path: device-build.log
