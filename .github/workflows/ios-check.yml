name: Tayya rescue navigation diagnostic
on:
  push:
    branches: ['diag/tayya-rescue-navigation']
permissions:
  contents: read
concurrency:
  group: rescue-navigation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  navigation:
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        family: [iPhone]
    steps:
      - uses: actions/checkout@v4
      - name: Select current app toolchain
        run: python3 Tools/select_app_xcode.py
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Select available simulator
        env:
          DEVICE_FAMILY: ${{ matrix.family }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          subprocess.run(["xcodebuild", "-version"], check=True)
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '--json']))['devices']
          matching = [(tuple(map(int, re.findall(r'\d+', runtime))), runtime, d) for runtime, rows in devices.items() if 'iOS' in runtime for d in rows if d['name'].startswith(os.environ['DEVICE_FAMILY'])]
          # Prefer the large current iPhone and iPad for real Store captures.
          matching.sort(key=lambda row: (row[0], 'Pro Max' in row[2]['name'] if os.environ['DEVICE_FAMILY'] == 'iPhone' else ('Pro' in row[2]['name'] and '13' in row[2]['name'])), reverse=True)
          if not matching:
              raise SystemExit('Required simulator family is unavailable')
          print('Simulator:', matching[0][1], matching[0][2]['name'])
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write('SIMULATOR_ID=' + matching[0][2]['udid'] + '\n')
          PY
      - name: Mark native diagnostic session
        run: touch "$RUNNER_TEMP/tayya-native-start"
      - name: Build and test
        run: |
          set -o pipefail
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          python3 Tools/seed_files_fixtures.py
          # Diagnostic only: unchanged edge/back/reopening regression on both families.
          xcodebuild test -only-testing:HashiyaUITests/LaunchTests/testWorkspaceNavigationKeepsBackEdgeAndRepeatedOpening -project Hashiya.xcodeproj -scheme Hashiya -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -test-timeouts-enabled YES -default-test-execution-time-allowance 240 -maximum-test-execution-time-allowance 360 -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO | tee build.log
      - name: Collect bounded navigation evidence
        if: always()
        run: |
          mkdir -p Evidence
          xcrun simctl spawn "$SIMULATOR_ID" log show --last 8m --style compact --predicate 'eventMessage CONTAINS "TayyaRescueNavigation" OR eventMessage CONTAINS "DocumentNavigationBoundary"' > Evidence/navigation.log
          xcrun xcresulttool get test-results summary --path TestResults.xcresult > Evidence/summary.json
          xcrun xcresulttool export attachments --path TestResults.xcresult --output-path Evidence/attachments
          cp build.log Evidence/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rescue-navigation-${{ matrix.family }}
          path: Evidence/
          retention-days: 7
