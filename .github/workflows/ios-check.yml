name: Tayya gesture and picker evidence
on:
  push:
    branches: ['diag/tayya-rescue-font']
permissions:
  contents: read
concurrency:
  group: rescue-font-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fonts:
    name: evidence (${{ matrix.family }})
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: iPhone
            cases: -only-testing:HashiyaUITests/LaunchTests/testIndividualInkTargetsAtAccessibilityTextSize -only-testing:HashiyaUITests/LaunchTests/testWorkspaceNavigationKeepsBackEdgeAndRepeatedOpening
    steps:
      - uses: actions/checkout@v4
      - name: Select current app toolchain
        run: python3 Tools/select_app_xcode.py
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Select available simulator
        env:
          DEVICE_FAMILY: ${{ matrix.family }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          subprocess.run(["xcodebuild", "-version"], check=True)
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '--json']))['devices']
          matching = [(tuple(map(int, re.findall(r'\d+', runtime))), runtime, d) for runtime, rows in devices.items() if 'iOS' in runtime for d in rows if d['name'].startswith(os.environ['DEVICE_FAMILY'])]
          # Prefer the large current iPhone and iPad for real Store captures.
          matching.sort(key=lambda row: (row[0], 'Pro Max' in row[2]['name'] if os.environ['DEVICE_FAMILY'] == 'iPhone' else ('Pro' in row[2]['name'] and '13' in row[2]['name'])), reverse=True)
          if not matching:
              raise SystemExit('Required simulator family is unavailable')
          print('Simulator:', matching[0][1], matching[0][2]['name'])
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write('SIMULATOR_ID=' + matching[0][2]['udid'] + '\n')
          PY
      - name: Mark native diagnostic session
        run: touch "$RUNNER_TEMP/tayya-native-start"
      - name: Qualify original ink and navigation regressions
        run: |
          set -o pipefail
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          python3 Tools/seed_files_fixtures.py
          xcodebuild test ${{ matrix.cases }} -project Hashiya.xcodeproj -scheme Hashiya -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath NativeBuild -test-timeouts-enabled YES -default-test-execution-time-allowance 240 -maximum-test-execution-time-allowance 360 -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO | tee build.log
      - name: Export exact generated guide and native result
        if: always()
        run: |
          mkdir -p Evidence
          for bundle in UnitResults TestResults; do
            if [ -d "$bundle.xcresult" ]; then
              xcrun xcresulttool get test-results summary --path "$bundle.xcresult" > "Evidence/$bundle-summary.json"
              xcrun xcresulttool export attachments --path "$bundle.xcresult" --output-path "Evidence/$bundle-attachments"
            fi
          done
          cp *build.log Evidence/
          xcrun simctl spawn "$SIMULATOR_ID" log show --last 15m --style compact --predicate 'eventMessage CONTAINS "TayyaRescue" OR eventMessage CONTAINS "DocumentNavigationBoundary" OR process CONTAINS[c] "ColorPicker"' > Evidence/gesture-picker.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rescue-gesture-picker-${{ matrix.family }}
          path: Evidence/
          retention-days: 7
