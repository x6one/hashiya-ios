name: iPhone and iPad preflight
on:
  workflow_dispatch:
  push:
    branches: [main, 'work/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        family: [iPhone, iPad]
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Select available simulator
        env:
          DEVICE_FAMILY: ${{ matrix.family }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '--json']))['devices']
          matching = [d for runtime, rows in devices.items() if 'iOS' in runtime for d in rows if d['name'].startswith(os.environ['DEVICE_FAMILY'])]
          if not matching:
              raise SystemExit('Required simulator family is unavailable')
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write('SIMULATOR_ID=' + matching[0]['udid'] + '\n')
          PY
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test -project Hashiya.xcodeproj -scheme Hashiya -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO | tee build.log
      - name: Save diagnostics and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.family }}
          path: |
            TestResults.xcresult
            build.log
          retention-days: 7
