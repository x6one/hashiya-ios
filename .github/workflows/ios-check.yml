name: Tayya targeted ink route diagnostic
on:
  push:
    branches: ['diag/tayya-ink-route']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ink-route-${{ github.ref }}
  cancel-in-progress: false
jobs:
  probe-iPhone:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Select app toolchain and generate project
        run: |
          python3 Tools/select_app_xcode.py
          brew install xcodegen
          xcodegen generate
      - name: Select and boot current iPhone
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          data=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','--json']))['devices']
          devices=[(tuple(map(int,re.findall(r'\d+',runtime))), 'Pro Max' in d['name'], d) for runtime,rows in data.items() if 'iOS' in runtime for d in rows if d['name'].startswith('iPhone')]
          devices.sort(key=lambda row:row[:2],reverse=True)
          simulator=devices[0][2]['udid']
          subprocess.run(['xcrun','simctl','boot',simulator],check=False)
          subprocess.run(['xcrun','simctl','bootstatus',simulator,'-b'],check=True)
          with open(os.environ['GITHUB_ENV'],'a') as out:out.write('SIMULATOR_ID='+simulator+'\n')
          PY
      - name: Seed the same native document-provider fixtures as full preflight
        run: python3 Tools/seed_files_fixtures.py
      - name: Reproduce the unchanged original ink case after its full-suite prefix
        run: |
          set -o pipefail
          xcodebuild test -project Hashiya.xcodeproj -scheme Hashiya -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -only-testing:HashiyaTests -only-testing:HashiyaUITests/LaunchTests/testActualDocumentPickerImportsPDF -only-testing:HashiyaUITests/LaunchTests/testActualDocumentPickerImportsPowerPoint -only-testing:HashiyaUITests/LaunchTests/testAppOwnedDocumentPickerImportsPDF -only-testing:HashiyaUITests/LaunchTests/testAReviewEntryProvidesCompleteLocalDemonstrationWithoutLogin -only-testing:HashiyaUITests/LaunchTests/testColdExternalPDFIntakeSurvivesFirstLaunchEntrance -only-testing:HashiyaUITests/LaunchTests/testColdExternalPDFIntakeWithReduceMotion -only-testing:HashiyaUITests/LaunchTests/testCreateNotebookFromLibrary -only-testing:HashiyaUITests/LaunchTests/testDeleteAddedDocumentAndMarginPagesThroughVisibleToolbar -only-testing:HashiyaUITests/LaunchTests/testDrawingToolDoesNotTurnPagesInDocumentOrSplit -only-testing:HashiyaUITests/LaunchTests/testExternalPDFIntakeDismissesAlreadyVisibleWelcome -only-testing:HashiyaUITests/LaunchTests/testIndividualInkTargetsAtAccessibilityTextSize -test-timeouts-enabled YES -default-test-execution-time-allowance 240 -maximum-test-execution-time-allowance 360 -resultBundlePath Probe.xcresult CODE_SIGNING_ALLOWED=NO | tee probe-build.log
      - name: Verify external fixture bytes after the unchanged import cases
        if: always()
        run: python3 Tools/seed_files_fixtures.py --verify
      - name: Collect native route evidence regardless of test result
        if: always()
        run: |
          python3 - <<'PY'
          import json,os,subprocess,shutil
          from pathlib import Path
          out=Path('ProbeEvidence');out.mkdir(exist_ok=True)
          result={'commit':os.environ['GITHUB_SHA'],'run':os.environ['GITHUB_RUN_ID'],'purpose':'Targeted diagnosis only. Not full preflight or release acceptance.'}
          try:
              with (out/'native-system.log').open('wb') as log:
                  subprocess.run(['xcrun','simctl','spawn',os.environ['SIMULATOR_ID'],'log','show','--last','20m','--style','compact','--info','--debug','--predicate','process == "Hashiya" OR process == "ReportCrash" OR process == "runningboardd"'],stdout=log,stderr=subprocess.STDOUT,timeout=120,check=True)
              result['native_log']='collected'
          except Exception as error:result['native_log_error']=str(error)
          roots=[Path.home()/'Library/Logs/DiagnosticReports',Path.home()/'Library/Developer/CoreSimulator/Devices'/os.environ.get('SIMULATOR_ID','missing')/'data/Library/Logs/CrashReporter']
          for index,root in enumerate(roots):
              if root.exists():
                  for source in root.rglob('*'):
                      if source.is_file() and source.suffix in ['.ips','.crash','.hang','.spin']:
                          target=out/'reports'/str(index)/source.relative_to(root);target.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(source,target)
          (out/'collection.json').write_text(json.dumps(result,indent=2)+'\n')
          PY
      - name: Export actual result and attachments
        if: always()
        run: |
          if [ -d Probe.xcresult ]; then
            ditto -c -k --keepParent Probe.xcresult Probe.xcresult.zip
            shasum -a 256 Probe.xcresult.zip > Probe.xcresult.sha256
            xcrun xcresulttool export attachments --path Probe.xcresult --output-path ProbeScreenshots
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: targeted-ink-route-evidence
          path: |
            probe-build.log
            ProbeEvidence/
            ProbeScreenshots/
            Probe.xcresult.zip
            Probe.xcresult.sha256
          retention-days: 7
