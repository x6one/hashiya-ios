name: Local Office engine feasibility
on:
  workflow_dispatch:
    inputs:
      expected_source:
        description: 'Optional immutable app SHA; reject a changed branch before any build or signing'
        type: string
        required: false
        default: ''
      sign_archive:
        description: 'Verify an App Store signed IPA without uploading it'
        type: boolean
        required: true
        default: false
      publish_to_apple:
        description: 'Archive, sign and upload after release audits and Apple credentials are approved'
        type: boolean
        required: true
        default: false
  # Reusable callers can only build the unsigned package.
  workflow_call:
permissions:
  contents: read
  actions: read
concurrency:
  group: office-engine-spike
  cancel-in-progress: false
jobs:
  ios-engine:
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - name: Require the explicitly pinned application source
        env:
          EXPECTED_APP_SOURCE: ${{ inputs.expected_source }}
        run: |
          python3 - <<'PY_SOURCE_PIN'
          import os,re
          expected=os.environ.get('EXPECTED_APP_SOURCE','')
          if expected:
              assert re.fullmatch('[a-f0-9]{40}',expected), 'Invalid immutable source pin'
              assert expected==os.environ['GITHUB_SHA'], 'The branch changed; do not build, sign or upload another source'
          PY_SOURCE_PIN
      - name: Check out pinned official Collabora sources
        uses: actions/checkout@v4
        with:
          repository: CollaboraOnline/online.mirror
          ref: 124ecf55b0f0969b7859d2f803f0bc3a0049a4dc
          fetch-depth: 1
          persist-credentials: false
      - name: Check out Hashiya build helper
        uses: actions/checkout@v4
        with:
          repository: x6one/hashiya-ios
          ref: ${{ github.sha }}
          path: hashiya-tools
          persist-credentials: false
      - name: Reuse the immutable qualified engine when its source is unchanged
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY_REUSE'
          import hashlib,json,os,shutil,subprocess,tarfile,zipfile
          from pathlib import Path,PurePosixPath
          baseline='d45457bdd216265b11d58ba844fcda22fb6297d9'
          subprocess.run(['git','-C','hashiya-tools','fetch','--no-tags','--depth=1','origin',baseline],check=True)
          unchanged=subprocess.run(['git','-C','hashiya-tools','diff','--quiet',baseline,'HEAD','--','NativeOffice','EngineBridge','Tools/link_office_engine.py','Tools/package_office_engine.py','Tools/prepare_native_office_app.py'])
          if unchanged.returncode==1:
              print('Engine inputs changed; preserve the original source-build path instead of reusing old archives')
              raise SystemExit(0)
          unchanged.check_returncode()
          endpoint='repos/x6one/hashiya-ios/actions/artifacts/13080813474'
          meta=json.loads(subprocess.check_output(['gh','api',endpoint],text=True))
          expected='42f462205aed991a63e1cab4e128906191d8f81482ac09c0c32c77fddf87eef1'
          if meta['expired'] is True:
              print('Preserved artifact expired; use the original checkpoint/source-build path')
              raise SystemExit(0)
          assert meta['expired'] is False
          assert meta['name']=='office-engine-arm64-linking-candidate'
          assert meta['workflow_run']['id']==41181915781 and meta['workflow_run']['head_sha']==baseline
          assert meta['size_in_bytes']==265995124 and meta['digest']=='sha256:'+expected
          archive=Path('qualified-engine.zip')
          with archive.open('xb') as out:subprocess.run(['gh','api',endpoint+'/zip'],stdout=out,check=True)
          assert archive.stat().st_size==265995124
          with archive.open('rb') as file:assert hashlib.file_digest(file,'sha256').hexdigest()==expected
          packed=Path('OfficeEngineCandidate.tar.gz')
          with zipfile.ZipFile(archive) as zipped:
              assert zipped.namelist()==['OfficeEngineCandidate.tar.gz'] and zipped.testzip() is None
              assert zipped.infolist()[0].file_size<2*1024**3
              with zipped.open(zipped.namelist()[0]) as source,packed.open('xb') as out:shutil.copyfileobj(source,out)
          with tarfile.open(packed,'r:gz') as tar:
              members=tar.getmembers()
              assert len(members)<100000 and sum(m.size for m in members)<16*1024**3
              names=set()
              for member in members:
                  path=PurePosixPath(member.name)
                  assert not path.is_absolute() and '..' not in path.parts and '\\' not in member.name
                  assert path.parts[0]=='OfficeEngineCandidate' and (member.isfile() or member.isdir())
                  assert path.as_posix() not in names
                  names.add(path.as_posix())
              manifest=json.load(tar.extractfile('OfficeEngineCandidate/manifest.json'))
              assert manifest['source']=='124ecf55b0f0969b7859d2f803f0bc3a0049a4dc'
              assert manifest['platform']=='iphoneos' and manifest['architecture']=='arm64'
              for member in members:
                  target=Path(member.name)
                  if member.isdir():target.mkdir(parents=True,exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True,exist_ok=True)
                      with tar.extractfile(member) as source,target.open('xb') as out:shutil.copyfileobj(source,out)
                      target.chmod(member.mode & 0o755)
          Path('diagnostics').mkdir(exist_ok=True)
          Path('diagnostics/engine-reuse-proof.json').write_text(json.dumps({'artifact':meta['id'],'sha256':expected,'qualified_run':41181915781,'qualified_source':baseline,'candidate':os.environ['GITHUB_SHA'],'native_source_unchanged':True,'source':manifest['source'],'reused_without_recompilation':True},indent=2)+'\n')
          with open(os.environ['GITHUB_ENV'],'a') as file:file.write('ENGINE_CANDIDATE_REUSED=true\n')
          PY_REUSE
      - name: Install build prerequisites
        run: |
          if [ "$ENGINE_CANDIDATE_REUSED" = "true" ]; then
            command -v xcodegen >/dev/null || brew install xcodegen
            test -x "$(brew --prefix openssl@3)/bin/openssl" || brew install openssl@3
          else
            brew install autoconf automake libtool pkg-config bison gperf nasm make llvm xcodegen
            echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
            echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
            echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          fi
          python3 -m venv "$RUNNER_TEMP/office-python"
          "$RUNNER_TEMP/office-python/bin/pip" install polib lxml pyyaml
          echo "$RUNNER_TEMP/office-python/bin" >> "$GITHUB_PATH"
      - name: Record SDK and source
        run: |
          mkdir -p diagnostics
          git rev-parse HEAD > diagnostics/source.txt
          xcodebuild -version > diagnostics/xcode.txt
          xcrun --sdk iphoneos --show-sdk-version > diagnostics/sdk.txt
          df -h > diagnostics/disk.txt
      - name: Choose checkpoint key
        if: env.ENGINE_CANDIDATE_REUSED != 'true'
        id: checkpoint-key
        run: |
          SDK_ID=$(xcodebuild -version | shasum -a 256 | cut -c1-12)
          echo "prefix=native-ios-124ecf55b0f0969b-v2-$SDK_ID-" >> "$GITHUB_OUTPUT"
      - name: Restore engine build checkpoint
        if: env.ENGINE_CANDIDATE_REUSED != 'true'
        uses: actions/cache/restore@v4
        with:
          path: engine
          key: ${{ steps.checkpoint-key.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.checkpoint-key.outputs.prefix }}
      - name: Configure the native iOS engine
        if: ${{ env.ENGINE_CANDIDATE_REUSED != 'true' && hashFiles('engine/config_host.mk') == '' }}
        working-directory: engine
        run: |
          set -o pipefail
          ./autogen.sh --with-distro=CPiOS --with-lang=en-US --without-java --without-help --without-myspell-dicts --disable-symbols --with-parallelism=4 2>&1 | tee ../diagnostics/configure.log
      - name: Build arm64 engine archives
        if: env.ENGINE_CANDIDATE_REUSED != 'true'
        timeout-minutes: 210
        working-directory: engine
        run: |
          set -o pipefail
          if [ -f .hashiya-engine-complete ]; then echo 'ENGINE_BUILD_REUSED=true' >> "$GITHUB_ENV"; fi
          make -j4 2>&1 | tee ../diagnostics/build.log
          test -s workdir/CustomTarget/ios/ios-all-static-libs.list
          touch .hashiya-engine-complete
          cp workdir/CustomTarget/ios/ios-all-static-libs.list ../diagnostics/
          find instdir workdir -name '*.a' -exec ls -lh {} + > ../diagnostics/archives.txt
      - name: Retain arm64 engine linking candidate
        run: |
          if [ "$ENGINE_CANDIDATE_REUSED" != "true" ]; then
            python3 hashiya-tools/Tools/package_office_engine.py engine OfficeEngineCandidate
          fi
          # Bound artifact storage; never upload the whole multi-gigabyte build.
          stat -f%z OfficeEngineCandidate.tar.gz > diagnostics/candidate-size-bytes.txt
          test "$(stat -f%z OfficeEngineCandidate.tar.gz)" -lt 2147483648
      - name: Save engine linking candidate
        uses: actions/upload-artifact@v4
        with:
          name: office-engine-arm64-linking-candidate
          path: OfficeEngineCandidate.tar.gz
          retention-days: 14
      - name: Link COKit and PDF export for an iOS device
        run: |
          set -o pipefail
          cp OfficeEngineCandidate/manifest.json diagnostics/engine-manifest.json
          python3 hashiya-tools/Tools/link_office_engine.py OfficeEngineCandidate diagnostics/link-probe 2>&1 | tee diagnostics/link-probe.log
      - name: Build the experimental Hashiya app with the local engine
        working-directory: hashiya-tools
        run: |
          set -o pipefail
          # Reuse the pinned engine toolchain/cache, then compile the app and
          # link against the same current SDK used by simulator verification.
          python3 Tools/select_app_xcode.py
          python3 Tools/prepare_native_office_app.py ../OfficeEngineCandidate ../diagnostics/link-probe project.yml
          xcodegen generate --spec NativeOfficeProject.yml
          xcodebuild -project Hashiya.xcodeproj -scheme Hashiya -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath NativeDeviceBuild CODE_SIGNING_ALLOWED=NO build 2>&1 | tee ../diagnostics/native-app-build.log
          test -s NativeDeviceBuild/Build/Products/Release-iphoneos/Hashiya.app/fundamentalrc
          test -s NativeDeviceBuild/Build/Products/Release-iphoneos/Hashiya.app/services.rdb
          test -d NativeDeviceBuild/Build/Products/Release-iphoneos/Hashiya.app/share/fonts/truetype
      - name: Preserve the current device binary API and privacy inventory
        working-directory: hashiya-tools
        run: |
          APP_PATH=NativeDeviceBuild/Build/Products/Release-iphoneos/Hashiya.app
          xcrun nm -u "$APP_PATH/Hashiya" > ../diagnostics/native-app-imports.txt
          xcrun otool -L "$APP_PATH/Hashiya" > ../diagnostics/native-app-libraries.txt
          python3 - <<'PY'
          import hashlib, json, plistlib
          from pathlib import Path
          app=Path('NativeDeviceBuild/Build/Products/Release-iphoneos/Hashiya.app')
          manifest=plistlib.loads((app/'PrivacyInfo.xcprivacy').read_bytes())
          reasons={entry['NSPrivacyAccessedAPIType']:entry['NSPrivacyAccessedAPITypeReasons'] for entry in manifest['NSPrivacyAccessedAPITypes']}
          assert 'CA92.1' in reasons.get('NSPrivacyAccessedAPICategoryUserDefaults',[])
          Path('../diagnostics/native-app-privacy.json').write_text(json.dumps({'executable_sha256':hashlib.sha256((app/'Hashiya').read_bytes()).hexdigest(),'app_root_manifest':manifest},indent=2)+'\n')
          PY
      - name: Require both simulator suites before native IPA packaging
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 hashiya-tools/Tools/require_preflight.py
      - name: Package the experimental unsigned native Office app
        run: python3 hashiya-tools/Tools/package_native_app.py hashiya-tools/NativeDeviceBuild/Build/Products/Release-iphoneos/Hashiya.app NativeOfficePackage
      - name: Save native Office IPA and signing evidence
        uses: actions/upload-artifact@v4
        with:
          name: Tayya-native-office-unsigned
          path: NativeOfficePackage/*
          retention-days: 14
      - name: Archive and verify; upload only when explicitly selected
        if: ${{ github.event_name == 'workflow_dispatch' && contains(github.workflow_ref, '/.github/workflows/office-engine-spike.yml@') && (inputs.sign_archive || inputs.publish_to_apple) }}
        working-directory: hashiya-tools
        env:
          APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          PUBLISH_TO_APPLE: ${{ inputs.publish_to_apple }}
        run: |
          if [ "$PUBLISH_TO_APPLE" = "true" ]; then
            python3 - <<'PY_UPLOAD_TARGET'
          import json,plistlib
          from pathlib import Path
          info=plistlib.loads(Path('NativeDeviceBuild/Build/Products/Release-iphoneos/Hashiya.app/Info.plist').read_bytes())
          assert info['CFBundleIdentifier']=='com.ahmadalawi.hashiya'
          Path('upload-target.json').write_text(json.dumps({'bundle_id':info['CFBundleIdentifier'],'version':info['CFBundleShortVersionString'],'build':str(info['CFBundleVersion'])}))
          PY_UPLOAD_TARGET
            node --input-type=module <<'JS_UPLOAD_TARGET'
          import {readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          import {createAppleClient} from './Tools/app_store_readiness.mjs';
          const target=JSON.parse(readFileSync('upload-target.json','utf8'));
          assert.match(target.build,/^[1-9]\d*$/);
          const api=createAppleClient();
          const app=(await api.get('apps/6818288428')).data;
          assert.equal(app.attributes.bundleId,target.bundle_id);
          const existing=await api.get('builds?filter[app]=6818288428&filter[version]='+encodeURIComponent(target.build)+'&limit=200');
          assert.ok(!existing.links?.next,'Exact build lookup must be complete');
          assert.equal(existing.data.length,0,'Build already exists: do not archive/upload it again; inspect the accepted upload instead');
          console.log('Apple confirms the exact upload build is unused:',target.version,target.build);
          JS_UPLOAD_TARGET
          fi
          if [ "$PUBLISH_TO_APPLE" = "true" ]; then
            python3 Tools/distribute_native_app.py --preserve-archive
          else
            python3 Tools/distribute_native_app.py --archive-only --preserve-archive
          fi
      - name: Retain signed IPA and upload evidence
        if: ${{ always() && github.event_name == 'workflow_dispatch' && contains(github.workflow_ref, '/.github/workflows/office-engine-spike.yml@') && (inputs.sign_archive || inputs.publish_to_apple) }}
        uses: actions/upload-artifact@v4
        with:
          name: Tayya-Apple-distribution
          path: |
            AppleDistribution/Export/*.ipa
            AppleDistribution/distribution-report.json
            AppleDistribution/Tayya.xcarchive
          if-no-files-found: ignore
          retention-days: 7
      - name: Measure build checkpoint
        if: always()
        id: checkpoint-size
        run: |
          if [ -d engine/workdir ]; then
            CHECKPOINT_KB=$(du -sk engine | cut -f1)
            echo "$CHECKPOINT_KB" > diagnostics/checkpoint-size-kb.txt
            # Keep below GitHub's default repository cache allowance.
            if [ "$CHECKPOINT_KB" -lt 8388608 ]; then
              echo "save=true" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Save resumable build checkpoint
        if: ${{ always() && steps.checkpoint-size.outputs.save == 'true' && env.ENGINE_BUILD_REUSED != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: engine
          key: ${{ steps.checkpoint-key.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save diagnostics, never a release IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-office-engine-diagnostics
          path: |
            diagnostics/
            engine/config.log
            engine/autogen.log
            engine/CONF-FOR-BUILD/config.log
          retention-days: 7
