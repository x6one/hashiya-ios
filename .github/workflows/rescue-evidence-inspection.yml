name: Inspect saved rescue evidence
on:
  push:
    branches: ['diag/tayya-evidence-inspection']
permissions:
  contents: read
  actions: read
concurrency:
  group: rescue-evidence-inspection
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check bounded ZIP reader syntax
        run: python3 -m py_compile Tools/inspect_rescue_zip_ranges.py
      - name: Read selected phone evidence without the raw xcresult ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: '12155597870'
          PROVIDED_SHA256: e804787ddd7178ba61d31c740a8b2de0f6ed5d840c15cb0118683a7cfadff8d2
          SAVED_DRAWINGS_OUTPUT: EvidenceInput/saved-drawings
          NATIVE_WINDOW_START: "2026-10-19 00:07:35.000"
          NATIVE_WINDOW_END: "2026-10-19 00:07:52.000"
        run: python3 Tools/inspect_rescue_zip_ranges.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selected-phone-saved-drawings
          path: EvidenceInput/
          retention-days: 7
