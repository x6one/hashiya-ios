name: Inspect saved rescue evidence
on:
  push:
    branches: ['diag/tayya-evidence-inspection']
permissions:
  contents: read
  actions: read
concurrency:
  group: rescue-evidence-inspection
  cancel-in-progress: false
jobs:
  inspect:
    name: inspect (${{ matrix.family }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: iPhone
            artifact: '12156731933'
            sha256: c1b97b32deabef93c5fea4bb1fae37833d6a7bda70ea4b841e6b5bb3722cc8fb
    steps:
      - uses: actions/checkout@v4
      - name: Check reader syntax
        run: python3 -m py_compile Tools/inspect_rescue_artifact.py
      - name: Inspect saved artifact bytes and bounded native evidence
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ matrix.artifact }}
          EXPECTED_SHA256: ${{ matrix.sha256 }}
          SAVED_DRAWINGS_OUTPUT: EvidenceInput/saved-drawings
        run: python3 Tools/inspect_rescue_artifact.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selected-rail-saved-drawings
          path: EvidenceInput/
          retention-days: 7
