name: Inspect saved rescue evidence
on:
  push:
    branches: ['diag/tayya-evidence-inspection']
permissions:
  contents: read
concurrency:
  group: rescue-evidence-inspection
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 247408a8619e47ba39e05dc25ba833a2262fc7ce
      - name: Check staged release workflow syntax
        run: |
          curl --fail --location --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -version
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes= .github/workflows/ios-check.yml .github/workflows/office-engine-spike.yml
      - name: Exercise incomplete-result evidence retention
        run: |
          python3 - <<'PY'
          import os, subprocess, tempfile
          from pathlib import Path
          import yaml
          
          workflow = yaml.safe_load(Path(".github/workflows/ios-check.yml").read_text())
          steps = {step.get("name"): step for step in workflow["jobs"]["test"]["steps"]}
          for name in ("Export UI screenshots", "Retain complete native test result"):
              with tempfile.TemporaryDirectory() as temporary:
                  root = Path(temporary)
                  for bundle in ("RegressionResults", "TestResults"):
                      (root / (bundle + ".xcresult")).mkdir()
                  binaries = root / "bin"; binaries.mkdir()
                  trace = root / "commands.log"
                  for command in ("xcrun", "ditto", "shasum"):
                      executable = binaries / command
                      executable.write_text("#!/bin/bash\nprintf '%s\\n' \"" + command + " $*\" >> \"$TRACE\"\nexit " + ("1" if command == "xcrun" else "0") + "\n")
                      executable.chmod(0o755)
                  environment = dict(os.environ, PATH=str(binaries) + os.pathsep + os.environ["PATH"], TRACE=str(trace))
                  result = subprocess.run(["bash", "-e", "-o", "pipefail", "-c", steps[name]["run"]],
                      cwd=root, env=environment, capture_output=True, text=True)
                  assert result.returncode == 1, (name, result.returncode, result.stderr)
                  commands = trace.read_text().splitlines()
                  for bundle in ("RegressionResults", "TestResults"):
                      assert any(line.startswith("xcrun ") and bundle + ".xcresult" in line for line in commands), commands
                      if name == "Retain complete native test result":
                          assert any(line.startswith("ditto ") and bundle + ".xcresult" in line for line in commands), commands
                          assert any(line.startswith("shasum ") and bundle + ".xcresult.zip" in line for line in commands), commands
                  print("PASS:", name, "attempts both bundles and reports summary/export failure")
          PY
