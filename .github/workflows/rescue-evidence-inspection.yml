name: Inspect saved rescue evidence
on:
  push:
    branches: ['diag/tayya-evidence-inspection']
permissions:
  contents: read
  actions: read
concurrency:
  group: rescue-evidence-inspection
  cancel-in-progress: false
jobs:
  inspect:
    name: inspect (${{ matrix.family }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: iPad
            artifact: '12156116109'
            sha256: 201e50dd9fc9eb3516f88046bc1cd19d7282e084b4211d69d1f9e7cb998a3e3a
    steps:
      - uses: actions/checkout@v4
      - name: Check reader syntax
        run: python3 -m py_compile Tools/inspect_rescue_artifact.py
      - name: Inspect saved artifact bytes and bounded native evidence
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ matrix.artifact }}
          EXPECTED_SHA256: ${{ matrix.sha256 }}
          SAVED_DRAWINGS_OUTPUT: EvidenceInput/saved-drawings
        run: python3 Tools/inspect_rescue_artifact.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selected-pad-saved-drawings
          path: EvidenceInput/
          retention-days: 7
