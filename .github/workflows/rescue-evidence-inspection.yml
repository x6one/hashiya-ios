name: Inspect saved rescue evidence
on:
  push:
    branches: ['diag/tayya-evidence-inspection']
permissions:
  contents: read
  actions: read
concurrency:
  group: rescue-evidence-inspection
  cancel-in-progress: false
jobs:
  inspect:
    name: inspect (${{ matrix.family }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: iPad
            artifact: '12155431299'
            sha256: 8e6c4120d2e2ca2f9abfcc2fc9ae7b85c4431d76f94df73560f342aea0e16235
    steps:
      - uses: actions/checkout@v4
      - name: Check reader syntax
        run: python3 -m py_compile Tools/inspect_rescue_artifact.py
      - name: Inspect saved artifact bytes and bounded native evidence
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ matrix.artifact }}
          EXPECTED_SHA256: ${{ matrix.sha256 }}
          PREVIEW_PATH: TestResults-attachments/CE1012A6-60FB-445E-8144-F70124D9327A.png
          NATIVE_WINDOW_START: "2026-10-18 23:42:43.000"
          NATIVE_WINDOW_END: "2026-10-18 23:43:06.000"
        run: python3 Tools/inspect_rescue_artifact.py
