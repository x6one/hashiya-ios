name: Inspect saved rescue evidence
on:
  push:
    branches: ['diag/tayya-evidence-inspection']
permissions:
  contents: read
  actions: read
concurrency:
  group: rescue-evidence-inspection
  cancel-in-progress: false
jobs:
  inspect:
    name: inspect (${{ matrix.family }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: iPhone
            artifact: '12158370721'
            sha256: cba24083f9d821894e418ba567afdfbce76894a163c1f64b60bab96b7d664190
    steps:
      - uses: actions/checkout@v4
      - name: Check reader syntax
        run: python3 -m py_compile Tools/inspect_rescue_artifact.py
      - name: Inspect saved artifact bytes and bounded native evidence
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ matrix.artifact }}
          EXPECTED_SHA256: ${{ matrix.sha256 }}
          SAVED_DRAWINGS_OUTPUT: EvidenceInput/saved-drawings
          SMALL_EVIDENCE_OUTPUT: EvidenceInput/subset
          VIDEO_EVIDENCE_OUTPUT: EvidenceVideo
        run: python3 Tools/inspect_rescue_artifact.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sampled-rail-small-evidence
          path: EvidenceInput/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rail-failure-recording-only
          path: EvidenceVideo/
          retention-days: 7
