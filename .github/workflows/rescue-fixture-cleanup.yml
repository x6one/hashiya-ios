name: Fixture lifecycle qualification
on:
  push:
    branches: ['diag/tayya-fixture-cleanup']
permissions:
  contents: read
concurrency:
  group: fixture-cleanup-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s Tools -p 'test_*.py'
  fonts:
    needs: tools
    name: evidence (${{ matrix.family }})
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        family: [iPhone, iPad]
    steps:
      - uses: actions/checkout@v4
      - name: Select current app toolchain
        run: python3 Tools/select_app_xcode.py
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Select available simulator
        env:
          DEVICE_FAMILY: ${{ matrix.family }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          subprocess.run(["xcodebuild", "-version"], check=True)
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '--json']))['devices']
          matching = [(tuple(map(int, re.findall(r'\d+', runtime))), runtime, d) for runtime, rows in devices.items() if 'iOS' in runtime for d in rows if d['name'].startswith(os.environ['DEVICE_FAMILY'])]
          # Prefer the large current iPhone and iPad for real Store captures.
          matching.sort(key=lambda row: (row[0], 'Pro Max' in row[2]['name'] if os.environ['DEVICE_FAMILY'] == 'iPhone' else ('Pro' in row[2]['name'] and '13' in row[2]['name'])), reverse=True)
          if not matching:
              raise SystemExit('Required simulator family is unavailable')
          print('Simulator:', matching[0][1], matching[0][2]['name'])
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write('SIMULATOR_ID=' + matching[0][2]['udid'] + '\n')
          PY
      - name: Mark native diagnostic session
        run: touch "$RUNNER_TEMP/tayya-native-start"
      - name: Repeat deliberate native edge input with original assertions
        run: |
          set -o pipefail
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          python3 Tools/seed_files_fixtures.py
          xcodebuild test -only-testing:HashiyaUITests/LaunchTests/testWorkspaceNavigationKeepsBackEdgeAndRepeatedOpening -test-iterations 3 -project Hashiya.xcodeproj -scheme Hashiya -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath NativeBuild -test-timeouts-enabled YES -default-test-execution-time-allowance 240 -maximum-test-execution-time-allowance 360 -resultBundlePath EdgeResults.xcresult CODE_SIGNING_ALLOWED=NO | tee edge-build.log
      - name: Qualify both original ink regressions
        if: always()
        run: |
          set -o pipefail
          xcodebuild test -only-testing:HashiyaUITests/LaunchTests/testIndividualInkTargetsAtAccessibilityTextSize -only-testing:HashiyaUITests/LaunchTests/testIndividualInkTargetsInDocumentAndCompactSplit -project Hashiya.xcodeproj -scheme Hashiya -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath NativeBuild -test-timeouts-enabled YES -default-test-execution-time-allowance 240 -maximum-test-execution-time-allowance 360 -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO | tee build.log
      - name: Verify fixture cleanup preserves native PDF and PowerPoint intake
        if: always()
        run: |
          set -o pipefail
          xcodebuild test -only-testing:HashiyaUITests/LaunchTests/testActualDocumentPickerImportsPDF -only-testing:HashiyaUITests/LaunchTests/testActualDocumentPickerImportsPowerPoint -project Hashiya.xcodeproj -scheme Hashiya -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath NativeBuild -test-timeouts-enabled YES -default-test-execution-time-allowance 240 -maximum-test-execution-time-allowance 360 -resultBundlePath FilesResults.xcresult CODE_SIGNING_ALLOWED=NO | tee files-build.log
      - name: Verify actual externally exported bytes
        if: always()
        run: python3 Tools/seed_files_fixtures.py --verify
      - name: Export exact generated guide and native result
        if: always()
        run: |
          mkdir -p Evidence
          for bundle in EdgeResults TestResults FilesResults; do
            if [ -d "$bundle.xcresult" ]; then
              xcrun xcresulttool get test-results summary --path "$bundle.xcresult" > "Evidence/$bundle-summary.json"
              xcrun xcresulttool export attachments --path "$bundle.xcresult" --output-path "Evidence/$bundle-attachments"
            fi
          done
          cp *build.log Evidence/
          xcrun simctl spawn "$SIMULATOR_ID" log show --last 30m --style compact --predicate 'eventMessage BEGINSWITH "TayyaRescue" OR eventMessage BEGINSWITH "DocumentNavigationBoundary" OR process CONTAINS[c] "ColorPicker" OR ((process == "runningboardd" OR process == "SpringBoard" OR process == "launchd_sim") AND eventMessage CONTAINS "com.ahmadalawi.hashiya")' > Evidence/gesture-picker.log

          python3 - <<'PY'
          from pathlib import Path
          import os, shutil
          since = (Path(os.environ["RUNNER_TEMP"]) / "tayya-native-start").stat().st_mtime
          roots = [Path.home() / "Library/Logs/DiagnosticReports",
              Path.home() / "Library/Developer/CoreSimulator/Devices" / os.environ["SIMULATOR_ID"] / "data/Library/Logs/CrashReporter"]
          destination = Path("Evidence/CrashReports"); destination.mkdir(exist_ok=True)
          copied = 0
          for root in roots:
              for path in root.glob("*.ips"):
                  try:
                      if not path.name.startswith(("Hashiya", "ColorPicker")) or path.stat().st_mtime < since:
                          continue
                      if copied >= 8 or path.stat().st_size > 4_000_000:
                          print("Relevant crash report omitted by evidence cap:", path.name); continue
                      shutil.copy2(path, destination / (str(copied) + "-" + path.name)); copied += 1
                  except OSError as error:
                      print("Crash report read unavailable:", path.name, type(error).__name__)
          print("Relevant current-session crash reports copied:", copied)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rescue-fixture-cleanup-${{ matrix.family }}
          path: Evidence/
          retention-days: 7
