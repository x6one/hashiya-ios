name: Tayya production integration
on:
  push:
    branches: ['integration/**']
  workflow_dispatch:
    inputs:
      suite:
        description: Focused production integration suite
        type: choice
        options: [foundation, library, workspace, audio, audio-controls, compatibility, language, study-tools, regressions, captures, ink-release, menu-dismissal, external-intake, full-fit-page-red, full-fit-page, notes-expansion, notes-expansion-wait, notes-contact, ink-screen-observer, all]
        default: foundation
permissions:
  contents: read
concurrency:
  group: tayya-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused:
    if: github.event_name == 'workflow_dispatch' || (contains(github.event.head_commit.message, '[integration:') && !contains(github.event.head_commit.message, '[integration:release]'))
    runs-on: macos-15
    timeout-minutes: 45
    env:
      TAYYA_INK_INPUT_PROBE: ${{ matrix.family == 'iPad' && contains(github.event.head_commit.message, '[diagnostic:ink-input-route]') && '1' || '' }}
      TEST_RUNNER_TAYYA_INK_INPUT_PROBE: ${{ matrix.family == 'iPad' && contains(github.event.head_commit.message, '[diagnostic:ink-input-route]') && '1' || '' }}
    strategy:
      fail-fast: false
      matrix:
        # Language/storage RED contracts are platform-independent; qualify both at GREEN.
        family: ${{ fromJSON((inputs.suite == 'document-undo-route-phone' || contains(github.event.head_commit.message, '[integration:document-undo-route-phone]')) && '["iPhone"]' || (inputs.suite == 'menu-dismissal' || contains(github.event.head_commit.message, '[integration:menu-dismissal]') || inputs.suite == 'ink-screen-observer' || contains(github.event.head_commit.message, '[integration:ink-screen-observer]') || inputs.suite == 'notes-contact' || contains(github.event.head_commit.message, '[integration:notes-contact]') || inputs.suite == 'notes-expansion-wait' || contains(github.event.head_commit.message, '[integration:notes-expansion-wait]') || contains(github.event.head_commit.message, '[integration:full-fit-page-red]')) && '["iPad"]' || (contains(github.event.head_commit.message, '[integration:notes-redo-diagnosis]') && !contains(github.event.head_commit.message, '[integration:notes-bounds-red]')) && '["iPad"]' || (contains(github.event.head_commit.message, '[integration:preset-diagnosis]') || contains(github.event.head_commit.message, '[integration:visibility-diagnosis]')) && '["iPad"]' || ((contains(github.event.head_commit.message, '[integration:notes-bounds-red]') && !contains(github.event.head_commit.message, '[integration:notes-redo-diagnosis]')) || contains(github.event.head_commit.message, '[integration:ink-observer-probe]') || contains(github.event.head_commit.message, '[integration:ink-palette-cycles]') || (contains(github.event.head_commit.message, '[integration:ink-render-diagnosis]') || (contains(github.event.head_commit.message, '[integration:ink-release]') || contains(github.event.head_commit.message, '[integration:external-intake]'))) || contains(github.event.head_commit.message, '[integration:visibility-input-diagnosis]') || contains(github.event.head_commit.message, '[integration:navigation-red]') || contains(github.event.head_commit.message, '[integration:language-red]') || contains(github.event.head_commit.message, '[integration:audio-controls-red]') || contains(github.event.head_commit.message, '[integration:study-ui-red]') || contains(github.event.head_commit.message, '[integration:study-diagnosis]')) && '["iPhone"]' || '["iPhone","iPad"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Select existing app toolchain and generate production project
        run: |
          python3 Tools/select_app_xcode.py
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate
      - name: Lint only integration Swift files
        if: matrix.family == 'iPhone' || inputs.suite == 'menu-dismissal' || contains(github.event.head_commit.message, '[integration:menu-dismissal]') || inputs.suite == 'ink-screen-observer' || contains(github.event.head_commit.message, '[integration:ink-screen-observer]') || inputs.suite == 'notes-contact' || contains(github.event.head_commit.message, '[integration:notes-contact]') || inputs.suite == 'notes-expansion-wait' || contains(github.event.head_commit.message, '[integration:notes-expansion-wait]')
        run: |
          for tool in swiftlint swiftformat; do
            command -v "$tool" >/dev/null || brew install "$tool"
          done
          git fetch --no-tags --depth=1 origin dbdb264bf86a6606be095aad22cd303ad01e2071
          python3 - <<'PY'
          import subprocess
          paths = subprocess.check_output(['git', 'diff', '--name-only', '--diff-filter=ACMR', 'dbdb264bf86a6606be095aad22cd303ad01e2071', 'HEAD', '--', 'App', 'Tests', 'UITests'], text=True).splitlines()
          paths = [path for path in paths if path.endswith('.swift')]
          if paths:
              subprocess.run(['swiftformat', '--lint', '--config', '.integration.swiftformat'] + paths, check=True)
              subprocess.run(['swiftlint', 'lint', '--strict', '--config', '.integration.swiftlint.yml'] + paths, check=True)
          PY
      - name: Select available simulator and focused suite
        env:
          DEVICE_FAMILY: ${{ matrix.family }}
          REQUESTED_SUITE: ${{ inputs.suite }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '--json']))['devices']
          family = os.environ['DEVICE_FAMILY']
          matching = [(tuple(map(int, re.findall(r'\d+', runtime))), d) for runtime, rows in devices.items() if 'iOS' in runtime for d in rows if d['name'].startswith(family)]
          if os.environ.get('TAYYA_INK_INPUT_PROBE') == '1':
              matching = [row for row in matching if row[0] == (26, 2) and row[1]['name'] == 'iPad Pro 13-inch (M5)']
              assert family == 'iPad' and len(matching) == 1, 'Preserve the original measured simulator and runtime'
          matching.sort(key=lambda row: (row[0], 'Pro Max' in row[1]['name'] if family == 'iPhone' else ('Pro' in row[1]['name'] and '13' in row[1]['name'])), reverse=True)
          if not matching:
              raise SystemExit('Required simulator family unavailable')
          requested = os.environ.get('REQUESTED_SUITE')
          suites = [requested] if requested else re.findall(r'\[integration:([a-z-]+)\]', os.environ.get('COMMIT_MESSAGE', ''))
          selections = {
              'canvas-undo-isolation': ['HashiyaTests/StudioUndoIsolationTests'],
              'split-undo-regression': ['HashiyaTests/StudioUndoIsolationTests/testSwitchingNotesPagePreservesDocumentUndoInActualSplit'],
              'ink-callback-boundary': ['HashiyaTests/MarginInkLifecycleTests/testNotesStrokeCommitsBeforePublishingIntoSwiftUI'],
              'ink-commit-boundaries': ['HashiyaTests/StudioUndoIsolationTests/testSwitchingNotesPagePreservesDocumentUndoInActualSplit', 'HashiyaTests/MarginInkLifecycleTests/testSwitchingNotesToTextFlushesUnfinishedInkToItsOriginalFile'],
              'ink-owner-and-gesture': ['HashiyaTests/StudioUndoIsolationTests', 'HashiyaTests/MarginInkLifecycleTests', 'HashiyaTests/DocumentInkCommitTests', 'HashiyaUITests/LaunchTests/testIndividualInkTargetsInDocumentAndCompactSplit', 'HashiyaUITests/LaunchTests/testIndividualInkTargetsAtAccessibilityTextSize'],
              'ink-storage-ownership': ['HashiyaTests/StudioUndoIsolationTests', 'HashiyaTests/MarginInkLifecycleTests', 'HashiyaTests/DocumentInkCommitTests', 'HashiyaTests/MarginPageTests'],
              'ink-atomic-publication': ['HashiyaTests/StudioUndoIsolationTests', 'HashiyaTests/MarginInkLifecycleTests', 'HashiyaTests/DocumentInkCommitTests', 'HashiyaTests/MarginPageTests'],
              'document-undo-route': ['HashiyaTests/StudioUndoIsolationTests', 'HashiyaUITests/LaunchTests/testIndividualInkTargetsInDocumentAndCompactSplit'],
              'document-undo-route-phone': ['HashiyaTests/StudioUndoIsolationTests', 'HashiyaUITests/LaunchTests/testIndividualInkTargetsInDocumentAndCompactSplit'],
              'release-boundaries': ['HashiyaUITests/StudioAudioUITests/testFirstMicrophoneGrantStartsAndSavesAnActualClip', 'HashiyaUITests/StudioEditorToolsTests/testFavoritePenUsesNativeBindingsAndSurvivesAppRelaunch', 'HashiyaUITests/StudioProductionCaptureTests/testArabicLightProductionStudyScreens', 'HashiyaUITests/StudioProductionCaptureTests/testRealRecordingAndPageMarkers', 'HashiyaUITests/StudioProductionCaptureTests/testNativeMenuAbsenceRejectsAnUnselectedVisibleAction'],
              'picker-boundary': ['HashiyaUITests/LaunchTests/testActualDocumentPickerImportsPDF', 'HashiyaUITests/LaunchTests/testActualDocumentPickerImportsPowerPoint', 'HashiyaUITests/LaunchTests/testAppOwnedDocumentPickerImportsPDF'],
              'menu-dismissal': ['HashiyaUITests/StudioProductionCaptureTests/testArabicDarkProductionScreens', 'HashiyaUITests/StudioProductionCaptureTests/testNativeMenuAbsenceRejectsAnUnselectedVisibleAction'],
              'menu-boundary': ['HashiyaUITests/StudioProductionCaptureTests/testLargestEnglishDarkProductionTextInBothOrientations'],
              'notes-redo-diagnosis': ['HashiyaUITests/LaunchTests/testIndividualInkTargetsAtAccessibilityTextSize'],
              'notes-bounds': ['HashiyaUITests/StudioProductionCaptureTests/testLargestArabicProductionTextInBothOrientations', 'HashiyaUITests/StudioProductionCaptureTests/testLargestEnglishDarkProductionTextInBothOrientations'],
              'notes-retention': ['HashiyaUITests/LaunchTests/testNewMarginStrokesWorkAfterSplitResizeRotationAndExpansion', 'HashiyaUITests/LaunchTests/testPaperStudioAccessibilityReduceMotionVisualCaptureJourney'],
              'ink-observer-probe': ['HashiyaTests/StudioNativeInkInspectionTests', 'HashiyaUITests/LaunchTests/testIndividualInkTargetsAtAccessibilityTextSize'],
              'ink-palette-cycles': ['HashiyaUITests/LaunchTests/testNotesPencilRemainsVisibleAfterRepeatedNativePaletteDismissals'],
              'ink-render-diagnosis': ['HashiyaUITests/LaunchTests/testIndividualInkTargetsAtAccessibilityTextSize'],
              'ink-release': ['HashiyaUITests/LaunchTests/testIndividualInkTargetsAtAccessibilityTextSize'],
              'full-fit-page-red': ['HashiyaTests/DocumentViewportTests/testFinalAddedPageRemainsSelectedWhenItCannotReachTheViewportTop'],
              'full-fit-page': ['HashiyaTests/DocumentViewportTests', 'HashiyaUITests/LaunchTests/testPagedMarginsKeepInkTextAndNavigationAfterResizeRotationAndRelaunch'],
              'ink-screen-observer': ['HashiyaUITests/LaunchTests/testIndividualInkTargetsAtAccessibilityTextSize'],
              'notes-contact': ['HashiyaUITests/LaunchTests/testNotesDockOpensFromOnePressAcrossScrollTouchDelayBoundary'],
              'notes-expansion-wait': ['HashiyaUITests/LaunchTests/testPaperStudioAccessibilityReduceMotionVisualCaptureJourney'],
              'notes-expansion': ['HashiyaUITests/LaunchTests/testPagedMarginsKeepInkTextAndNavigationAfterResizeRotationAndRelaunch', 'HashiyaUITests/LaunchTests/testDeleteAddedDocumentAndMarginPagesThroughVisibleToolbar', 'HashiyaUITests/LaunchTests/testPaperStudioAccessibilityReduceMotionVisualCaptureJourney'],
              'external-intake': ['HashiyaUITests/LaunchTests/testColdExternalPDFIntakeSurvivesFirstLaunchEntrance', 'HashiyaUITests/LaunchTests/testColdExternalPDFIntakeWithReduceMotion', 'HashiyaUITests/LaunchTests/testExternalPDFIntakeDismissesAlreadyVisibleWelcome'],
              'visibility-input-diagnosis': ['HashiyaUITests/LaunchTests/testPaperStudioAccessibilityReduceMotionVisualCaptureJourney', 'HashiyaUITests/StudioProductionCaptureTests/testLargestArabicProductionTextInBothOrientations'],
              'retained-host': ['HashiyaTests/StudioNativeVisibilityTests', 'HashiyaUITests/LaunchTests/testPaperStudioAccessibilityReduceMotionVisualCaptureJourney', 'HashiyaUITests/LaunchTests/testIndividualInkTargetsAtAccessibilityTextSize', 'HashiyaUITests/StudioProductionCaptureTests/testLargestArabicProductionTextInBothOrientations', 'HashiyaUITests/StudioProductionCaptureTests/testLargestEnglishDarkProductionTextInBothOrientations'],
              'visibility-diagnosis': ['HashiyaTests/StudioNativeVisibilityTests', 'HashiyaUITests/LaunchTests/testPaperStudioAccessibilityReduceMotionVisualCaptureJourney'],
              'navigation-safety': ['HashiyaUITests/StudioProductionCaptureTests/testLargestArabicProductionTextInBothOrientations', 'HashiyaUITests/StudioProductionCaptureTests/testLargestEnglishDarkProductionTextInBothOrientations', 'HashiyaUITests/LaunchTests/testPaperStudioAccessibilityReduceMotionVisualCaptureJourney', 'HashiyaUITests/LaunchTests/testIndividualInkTargetsAtAccessibilityTextSize'],
              'navigation': ['HashiyaUITests/StudioProductionCaptureTests/testLargestArabicProductionTextInBothOrientations', 'HashiyaUITests/StudioProductionCaptureTests/testLargestEnglishDarkProductionTextInBothOrientations', 'HashiyaTests/DocumentViewportTests', 'HashiyaUITests/LaunchTests/testPaperStudioAccessibilityReduceMotionVisualCaptureJourney'],
              'capture-repair': ['HashiyaUITests/StudioEditorToolsTests/testFavoritePenUsesNativeBindingsAndSurvivesAppRelaunch', 'HashiyaUITests/StudioProductionCaptureTests/testArabicLightProductionStudyScreens', 'HashiyaUITests/StudioProductionCaptureTests/testArabicLandscapeProductionSplitAndInk', 'HashiyaUITests/StudioProductionCaptureTests/testLargestArabicProductionTextInBothOrientations'],
              'captures': ['HashiyaUITests/StudioProductionCaptureTests'],
              'study-diagnosis': ['HashiyaTests/StudioThumbnailTests/testInsertionRemovalAndDamagedInkNeverReturnWrongPageOrBlankSuccess', 'HashiyaUITests/StudioEditorToolsTests/testPenAndNativeMenuNeverPresentTextKeyboardOrHideBrushActions'],
              'preset-diagnosis': ['HashiyaUITests/StudioEditorToolsTests/testFavoritePenUsesNativeBindingsAndSurvivesAppRelaunch'],
              'preset': ['HashiyaUITests/StudioEditorToolsTests/testFavoritePenUsesNativeBindingsAndSurvivesAppRelaunch'],
              'foundation': ['HashiyaTests/StudioIntegrationThemeTests'],
              'library': ['HashiyaTests/DocumentTests', 'HashiyaTests/DocumentImportTests', 'HashiyaTests/OfficeReplacementTests', 'HashiyaTests/ReadingPositionTests', 'HashiyaUITests/StudioIntegrationTests'],
              'workspace': ['HashiyaTests/DocumentViewportTests', 'HashiyaTests/DocumentInkCommitTests', 'HashiyaTests/MarginPageTests', 'HashiyaTests/StudioLocalizationTests', 'HashiyaTests/StudioTextFormattingTests', 'HashiyaUITests/StudioIntegrationTests'],
              'audio': ['HashiyaTests/WorkspaceAudioTests', 'HashiyaTests/AudioPlaybackTests', 'HashiyaTests/AudioDeletionTests', 'HashiyaTests/StudioAudioIntegrationTests', 'HashiyaTests/StudioAudioManagementTests'],
              'compatibility': ['HashiyaTests/PageRemovalTests', 'HashiyaTests/StudioDataCompatibilityTests'],
              'language': ['HashiyaUITests/StudioIntegrationTests/testEnglishCoreToolsUseEnglishNamesAndKeepRealNotesData'],
              'data-safety': ['HashiyaTests/StudioDataCompatibilityTests/testUnreadableTextCannotBeReplacedBySavingNewAnnotation', 'HashiyaTests/StudioDataCompatibilityTests/testUnreadableCardsCannotBeReplacedBySavingNewCard', 'HashiyaTests/StudioDataCompatibilityTests/testUnreadableLibraryCannotBeReplacedByCreatingNotebook', 'HashiyaTests/StudioDataCompatibilityTests/testUnreadablePDFCannotBeReplacedByAppendingPaper'],
              'audio-page': ['HashiyaUITests/StudioAudioUITests/testContinuousRecordingKeepsOneClipAndLinksBothVisitedPages'],
              'audio-controls': ['HashiyaUITests/StudioAudioUITests'],
              'audio-seek': ['HashiyaTests/StudioAudioManagementTests/testRealPlaybackPauseSeekRateAndPeerHandoffPreserveMedia', 'HashiyaTests/StudioAudioManagementTests/testMarkerAtZeroRestartsAnAlreadyPlayingRecording'],
              'chrome': ['HashiyaUITests/StudioIntegrationTests/testAccessibilitySecondaryChromeStaysInsideItsReservedArea'],
              'ink-safety': ['HashiyaTests/StudioInkSafetyTests'],
              'audio-probe': ['HashiyaTests/StudioAudioNativeProbeTests'],
              'library-safety': ['HashiyaTests/StudioLibraryWriteSafetyTests'],
              'study-ui': ['HashiyaUITests/StudioEditorToolsTests'],
              'study-tools': ['HashiyaTests/StudioPenPresetTests', 'HashiyaTests/StudioThumbnailTests', 'HashiyaUITests/StudioEditorToolsTests'],
              'regressions': ['HashiyaUITests/LaunchTests/testIndividualInkTargetsAtAccessibilityTextSize', 'HashiyaUITests/LaunchTests/testIndividualInkTargetsInDocumentAndCompactSplit', 'HashiyaUITests/LaunchTests/testWorkspaceNavigationKeepsBackEdgeAndRepeatedOpening'],
              'all': ['HashiyaTests', 'HashiyaUITests/StudioIntegrationTests', 'HashiyaUITests/StudioAudioUITests', 'HashiyaUITests/StudioEditorToolsTests']
          }
          selected = []
          for requested_suite in suites:
              # One diagnosis batch, different evidence on each device; never
              # duplicate a phone capture run on iPad or its native Undo probe.
              if 'notes-bounds-red' in suites and 'notes-redo-diagnosis' in suites:
                  if family == 'iPad' and requested_suite == 'notes-bounds-red':
                      continue
                  if family == 'iPhone' and requested_suite == 'notes-redo-diagnosis':
                      continue
              suite = requested_suite if requested_suite == 'full-fit-page-red' else requested_suite.removesuffix('-red')
              if suite not in selections:
                  raise SystemExit('Unknown focused suite: ' + suite)
              # RED runs isolate the new failing contracts, not adjacent green suites.
              names = ['HashiyaUITests/StudioProductionCaptureTests/testLargestArabicProductionTextInBothOrientations'] if requested_suite == 'navigation-red' else ['HashiyaUITests/StudioIntegrationTests'] if requested_suite == 'workspace-red' else ['HashiyaTests/StudioAudioIntegrationTests'] if requested_suite == 'audio-red' else selections[suite]
              selected += [name for name in names if name not in selected]
          if 'ink-atomic-publication' in suites and family == 'iPad':
              selected.append('HashiyaUITests/LaunchTests/testIndividualInkTargetsAtAccessibilityTextSize')
          if not selected:
              raise SystemExit('No production tests selected')
          with open('integration-selection.json', 'w') as out:
              release_probe = 'ink-release' in suites
              json.dump({'sha': os.environ['GITHUB_SHA'], 'family': family, 'device': matching[0][1], 'suites': suites, 'onlyTesting': selected,
                         'configuration': 'Release' if release_probe else 'Debug',
                         'scheme': 'HashiyaReleaseInk' if release_probe else 'Hashiya'}, out, indent=2)
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write('SIMULATOR_ID=' + matching[0][1]['udid'] + '\n')
          PY
      - name: Boot simulator and prepare existing file fixtures
        run: |
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          python3 Tools/seed_files_fixtures.py
          python3 - <<'PY'
          import json, os, subprocess
          path = 'integration-selection.json'
          selection = json.load(open(path))
          if selection['configuration'] == 'Release':
              # Release excludes DebugVisualEnvironment. Use the real Simulator
              # setting corresponding to its original accessibility1 test size.
              args = ['xcrun', 'simctl', 'ui', os.environ['SIMULATOR_ID'], 'content_size']
              subprocess.run(args + ['accessibility-medium'], check=True)
              actual = subprocess.check_output(args, text=True).strip()
              assert actual == 'accessibility-medium', actual
              selection['nativeContentSize'] = actual
              with open(path, 'w') as out:
                  json.dump(selection, out, indent=2)
              print('Verified real Simulator content size:', actual)
          PY
      - name: Run selected production tests
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          selection = json.load(open('integration-selection.json'))
          args = ['xcodebuild', 'test', '-project', 'Hashiya.xcodeproj', '-scheme', selection['scheme'], '-configuration', selection['configuration'], '-destination', 'platform=iOS Simulator,id=' + os.environ['SIMULATOR_ID'], '-derivedDataPath', 'IntegrationBuild', '-resultBundlePath', 'IntegrationResults.xcresult', '-test-timeouts-enabled', 'YES', '-default-test-execution-time-allowance', '240', '-maximum-test-execution-time-allowance', '360', 'CODE_SIGNING_ALLOWED=NO']
          args += ['-only-testing:' + name for name in selection['onlyTesting']]
          raise SystemExit(subprocess.call(args))
          PY
      - name: Verify actual simulator microphone authorization after the cold-grant contract
        if: always() && contains(github.event.head_commit.message, '[integration:release-boundaries]')
        run: |
          mkdir -p MicrophonePermission
          python3 - <<'PY'
          import json, os, sqlite3, subprocess
          from pathlib import Path
          device=os.environ['SIMULATOR_ID']
          database=Path.home()/'Library/Developer/CoreSimulator/Devices'/device/'data/Library/TCC/TCC.db'
          report={'source':os.environ['GITHUB_SHA'],'device':device,'read_only':True,'service':'kTCCServiceMicrophone','client':'com.ahmadalawi.hashiya'}
          if database.is_file():
              with sqlite3.connect(database.as_uri()+'?mode=ro',uri=True) as connection:
                  rows=connection.execute('SELECT auth_value,auth_reason,last_modified FROM access WHERE service=? AND client=?',('kTCCServiceMicrophone','com.ahmadalawi.hashiya')).fetchall()
              report['authorization_rows']=[dict(zip(['auth_value','auth_reason','last_modified'],row)) for row in rows]
          else: report['database_unavailable']=True
          Path('MicrophonePermission/authorization.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report))
          subprocess.run(['xcrun','simctl','io',device,'screenshot','MicrophonePermission/original-system-display.png'],check=True)
          PY
      - name: Preserve failed synthetic ink and native renderer evidence
        if: failure()
        run: python3 Tools/capture_native_ink_failure.py
      - name: Retain native summary and unmodified attachments
        if: always()
        run: |
          if [ -d IntegrationResults.xcresult ]; then
            mkdir -p IntegrationEvidence
            xcrun xcresulttool get test-results summary --path IntegrationResults.xcresult > IntegrationEvidence/summary.json
            xcrun xcresulttool get test-results tests --path IntegrationResults.xcresult > IntegrationEvidence/tests.json
            xcrun xcresulttool export attachments --path IntegrationResults.xcresult --output-path IntegrationEvidence/Screenshots
            ditto -c -k --keepParent IntegrationResults.xcresult IntegrationEvidence/IntegrationResults.xcresult.zip
          fi
      - name: Stage unmodified native production captures
        if: success() && (inputs.suite == 'captures' || contains(github.event.head_commit.message, '[integration:captures]'))
        run: |
          python3 -m Tools.stage_integration_captures --summary IntegrationEvidence/summary.json --attachments IntegrationEvidence/Screenshots --output ProductionCaptures --source "$GITHUB_SHA" --family "${{ matrix.family }}" --run "$GITHUB_RUN_ID"
      - name: Upload small native capture evidence
        if: success() && (inputs.suite == 'captures' || contains(github.event.head_commit.message, '[integration:captures]'))
        uses: actions/upload-artifact@v4
        with:
          name: production-captures-${{ matrix.family }}
          path: ProductionCaptures/
          retention-days: 14
      - name: Require executed tests without failures or skips
        run: |
          python3 - <<'PY'
          import json
          summary = json.load(open('IntegrationEvidence/summary.json'))
          selection = json.load(open('integration-selection.json'))
          assert summary['result'] == 'Passed', summary
          assert summary['passedTests'] > 0, 'An empty test selection is not verification'
          methods = selection['onlyTesting']
          if all(name.count('/') == 2 for name in methods):
              assert summary['passedTests'] == len(methods), ('Every selected method must execute', methods, summary)
          assert summary['failedTests'] == summary['skippedTests'] == summary['expectedFailures'] == 0, summary
          print('Verified native tests:', summary['passedTests'])
          PY
      - name: Retain small unmodified menu-control images and receipts
        if: always() && (inputs.suite == 'menu-dismissal' || contains(github.event.head_commit.message, '[integration:menu-dismissal]'))
        uses: actions/upload-artifact@v4
        with:
          name: native-menu-controls-${{ matrix.family }}
          path: |
            integration-selection.json
            IntegrationEvidence/summary.json
            IntegrationEvidence/Screenshots/*.png
            IntegrationEvidence/Screenshots/*.txt
            IntegrationEvidence/Screenshots/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain the existing input recorder without GPU instrumentation
        if: always() && contains(github.event.head_commit.message, '[diagnostic:ink-input-route]')
        run: |
          mkdir -p InkInputEvidence
          cp integration-selection.json InkInputEvidence/
          if [ -f IntegrationEvidence/summary.json ]; then cp IntegrationEvidence/summary.json InkInputEvidence/; fi
          xcrun simctl spawn "$SIMULATOR_ID" log show --last 15m --style compact --info --debug --predicate 'process == "Hashiya" AND (eventMessage BEGINSWITH "TayyaNotesInput" OR eventMessage BEGINSWITH "TayyaRescueRailCancel")' > InkInputEvidence/native-input.log
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          out=Path('InkInputEvidence'); log=(out/'native-input.log').read_text()
          summary=json.loads((out/'summary.json').read_text()) if (out/'summary.json').is_file() else None
          installed='TayyaNotesInput installed=1 version=3' in log
          report={'source':os.environ['GITHUB_SHA'],'run':os.environ['GITHUB_RUN_ID'],'installed_recorder':installed,'native_summary':summary,'scope':'One original iPad case with existing opt-in window recorder; no Metal trace or automatic causal/release conclusion.'}
          (out/'proof.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          assert installed, 'Actual App did not confirm the requested input recorder'
          assert summary and summary['totalTestCount']==1 and summary['skippedTests']==summary['expectedFailures']==0,summary
          PY
      - name: Upload small native input receipts
        if: always() && contains(github.event.head_commit.message, '[diagnostic:ink-input-route]')
        uses: actions/upload-artifact@v4
        with:
          name: native-ink-input-${{ matrix.family }}
          path: |
            InkInputEvidence/
            IntegrationEvidence/Screenshots/*.txt
            IntegrationEvidence/Screenshots/*.json
          retention-days: 14
      - name: Upload focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-${{ matrix.family }}
          path: |
            integration-selection.json
            IntegrationEvidence/
            MicrophonePermission/
          retention-days: 14
  production-review:
    needs: focused
    if: inputs.suite == 'captures' || contains(github.event.head_commit.message, '[integration:captures]')
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/tayya-production-review.yml
    with:
      job-prefix: focused
