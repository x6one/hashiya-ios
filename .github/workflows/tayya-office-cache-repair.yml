name: Tayya portable Office checkpoint repair
on:
  workflow_run:
    workflows: [Tayya Store artwork and approved publication]
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: tayya-office-checkpoint-repair
  cancel-in-progress: false
jobs:
  repair-office-cache:
    if: ${{ github.repository == 'x6one/hashiya-ios' && github.event.workflow_run.head_branch == 'store/tayya-app-store-content' && github.event.workflow_run.head_sha == '113eab72a5cb7bf5eb6b11490e823365d6833581' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out the unchanged pinned Office source
        uses: actions/checkout@v4
        with:
          repository: CollaboraOnline/online.mirror
          ref: 124ecf55b0f0969b7859d2f803f0bc3a0049a4dc
          persist-credentials: false
      - name: Install the original Office build prerequisites
        run: |
          brew install autoconf automake libtool pkg-config bison gperf nasm make llvm xcodegen
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          python3 -m venv "$RUNNER_TEMP/office-python"
          "$RUNNER_TEMP/office-python/bin/pip" install polib lxml pyyaml
          echo "$RUNNER_TEMP/office-python/bin" >> "$GITHUB_PATH"
      - name: Use the existing exact toolchain checkpoint namespace
        id: checkpoint
        run: |
          test "$GITHUB_REF" = refs/heads/main
          mkdir -p CacheRepair
          xcodebuild -version | tee CacheRepair/xcode.txt
          SDK_ID=$(xcodebuild -version | shasum -a 256 | cut -c1-12)
          test "$SDK_ID" = a8be4f9af0a2
          echo "prefix=native-ios-124ecf55b0f0969b-v2-$SDK_ID-" >> "$GITHUB_OUTPUT"
      - name: Restore the failed build's existing checkpoint
        uses: actions/cache/restore@v4
        with:
          path: engine
          key: ${{ steps.checkpoint.outputs.prefix }}${{ github.run_id }}-portable-tmp
          restore-keys: ${{ steps.checkpoint.outputs.prefix }}
      - name: Consume the saved real archiver proof and correct cached runtime configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess, zipfile
          from pathlib import Path
          root=Path('engine'); out=Path('CacheRepair')
          artifact='13038686137'
          endpoint='repos/x6one/hashiya-ios/actions/artifacts/'+artifact
          metadata=json.loads(subprocess.check_output(['gh','api',endpoint],text=True))
          assert metadata['expired'] is False and metadata['size_in_bytes']==2347
          assert metadata['digest']=='sha256:143ad738f938de4f272b1fde744a63cf107e27f68f601e02c15d07bd172a757e'
          assert metadata['workflow_run']['id']==41189643913 and metadata['workflow_run']['head_sha']=='19d5faf042e148291fd195e69c006f98974cf00a'
          packed=out/'original-archiver-proof.zip'
          with packed.open('wb') as target:subprocess.run(['gh','api',endpoint+'/zip'],stdout=target,check=True)
          assert packed.stat().st_size==2347 and hashlib.sha256(packed.read_bytes()).hexdigest()==metadata['digest'].split(':')[1]
          with zipfile.ZipFile(packed) as archive:
              assert archive.testzip() is None
              report=json.loads(archive.read('repair.json'))
              fixed=out/'original-portable-temp.a';fixed.write_bytes(archive.read('portable-temp.a'))
          assert report['app_source']=='d45457bdd216265b11d58ba844fcda22fb6297d9'
          assert report['upstream']=='124ecf55b0f0969b7859d2f803f0bc3a0049a4dc'
          assert report['baseline_exit']==1 and 'ar: temporary file: No such file or directory' in report['baseline_stderr']
          assert report['production_application_changed'] is report['signing_or_upload_performed'] is False
          config=root/'config_host.mk';text=config.read_text()
          def setting(name):
              matches=re.findall(r'^export '+re.escape(name)+r'=(.+)$',text,re.M)
              assert len(matches)==1,(name,matches)
              return matches[0].strip().strip("'\"")
          obsolete=setting('TMPDIR');ar=Path(setting('AR'))
          assert obsolete==report['obsolete_tmpdir']=='/var/folders/nj/vtw8zd2j31d1gdrtntc5y4600000gn/T/'
          assert not Path(obsolete).exists() and ar.is_file()
          obj=root/'workdir/GenCObject/CustomTarget/i18npool/breakiterator/OpenOffice_dat.o'
          expected='712c206c84be917ea14b64c13ef878156454960862d0645b8dcc469cba4b4679'
          assert report['object_sha256']==hashlib.sha256(obj.read_bytes()).hexdigest()==expected
          # Validate the already-created native archive, including Apple's real
          # symbol-index member. Do not repeat the successful RED/GREEN experiment.
          members=subprocess.check_output([str(ar),'-t',str(fixed)],text=True).splitlines()
          assert members==['__.SYMDEF SORTED',obj.name],members
          extracted=subprocess.check_output([str(ar),'-p',str(fixed),obj.name])
          assert hashlib.sha256(extracted).hexdigest()==expected
          normalized=[]
          for candidate in [config,root/'CONF-FOR-BUILD/config_host.mk']:
              if not candidate.is_file():continue
              original=candidate.read_text();stat=candidate.stat()
              changed,count=re.subn(r'^export TMPDIR=.+$', 'export TMPDIR=/tmp', original, flags=re.M)
              assert count==1,(str(candidate),count)
              candidate.write_text(changed)
              os.utime(candidate,ns=(stat.st_atime_ns,stat.st_mtime_ns))
              normalized.append(str(candidate))
          report.update(original_proof_run=41189643913,original_proof_artifact=int(artifact),fixed_members=members,normalized_configurations=normalized,new_tmpdir='/tmp',red_green_verified_from_immutable_evidence=True,original_object_and_archive_bytes_equal=True)
          (out/'repair.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY
      - name: Complete the original arm64 engine build with the portable cached configuration
        working-directory: engine
        run: |
          set -o pipefail
          make -j4 2>&1 | tee ../CacheRepair/engine-build.log
          test -s workdir/CustomTarget/ios/ios-all-static-libs.list
          touch .hashiya-engine-complete
          python3 - <<'PY_CONFIG'
          import json, re
          from pathlib import Path
          proof=Path('../CacheRepair/repair.json')
          report=json.loads(proof.read_text())
          for name in report['normalized_configurations']:
              configuration=Path('..')/name
              assert re.findall(r'^export TMPDIR=(.+)$', configuration.read_text(), re.M)==['/tmp'], str(configuration)
          report['full_original_make_passed']=True
          report['portable_configuration_verified_after_make']=True
          proof.write_text(json.dumps(report,indent=2)+'\n')
          PY_CONFIG
          test "$(du -sk . | cut -f1)" -lt 8388608
      - name: Save a new portable checkpoint without deleting the original cache
        uses: actions/cache/save@v4
        with:
          path: engine
          key: ${{ steps.checkpoint.outputs.prefix }}${{ github.run_id }}-portable-tmp
      - name: Preserve actual repair results without credentials or an IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Tayya-Office-Cache-Repair-${{ github.run_id }}
          path: CacheRepair/
          retention-days: 14
          if-no-files-found: warn
