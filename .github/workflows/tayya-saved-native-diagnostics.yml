name: Read preserved native rendering diagnostics
on:
  push:
    branches: [integration/tayya-app-store]
    paths: [.github/workflows/tayya-saved-native-diagnostics.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: tayya-saved-native-diagnostics
  cancel-in-progress: false
jobs:
  preserved-log:
    if: contains(github.event.head_commit.message, '[diagnostic:saved-native-log]')
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Select the existing native result reader
        run: python3 Tools/select_app_xcode.py
      - name: Verify and extract the preserved successful reference result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/x6one/hashiya-ios/actions/artifacts/12709270454 > "$RUNNER_TEMP/native-artifact-metadata.json"
          gh api repos/x6one/hashiya-ios/actions/artifacts/12709270454/zip > "$RUNNER_TEMP/native-original.zip"
          python3 - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path
          temp=Path(os.environ['RUNNER_TEMP'])
          metadata=json.loads((temp/'native-artifact-metadata.json').read_text())
          expected='d38e34bb51ebe40b85c4b17a1e30571656799372362a4e9d6889ba6acdf35680'
          source='94dcc066a080543cdeb1f8db3a8ad8c5a1b12009'
          assert metadata['workflow_run']['id']==40446156528 and metadata['workflow_run']['head_sha']==source
          assert metadata['id']==12709270454 and metadata['name']=='Tayya-real-app-thumbnail-thread-worker'
          archive=temp/'native-original.zip'
          assert archive.stat().st_size==91760845
          digest=hashlib.sha256()
          with archive.open('rb') as f:
              for block in iter(lambda:f.read(1024*1024),b''):digest.update(block)
          assert digest.hexdigest()==expected
          assert metadata.get('digest')=='sha256:'+expected
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None
              inner=temp/'original-xcresult.zip'
              inner.write_bytes(z.read('ThreadResults.xcresult.zip'))
          destination=temp/'original-result'
          destination.mkdir()
          with zipfile.ZipFile(inner) as z:
              assert z.testzip() is None
              for item in z.infolist():
                  assert (destination/item.filename).resolve().is_relative_to(destination.resolve())
                  assert (item.external_attr>>16)&0o170000!=0o120000, 'Refuse archive symlinks'
              z.extractall(destination)
          evidence=Path('SavedNativeLogEvidence');evidence.mkdir()
          (evidence/'source.json').write_text(json.dumps({'application_source':source,'original_run':40446156528,'artifact':12709270454,'artifact_sha256':expected,'artifact_bytes':91760845,'sha_crc_verified':True,'reader_source':os.environ['GITHUB_SHA'],'reader_run':os.environ['GITHUB_RUN_ID'],'scope':'Read-only saved xcresult export. NO application build, tests, signing or Apple writes.'},indent=2)+'\n')
          print('Saved successful reference source, SHA256 and ZIP integrity verified.')
          PY
      - name: Export the preserved native diagnostics without launching a simulator
        run: |
          xcrun xcresulttool export diagnostics --path "$RUNNER_TEMP/original-result/ThreadResults.xcresult" --output-path "$RUNNER_TEMP/native-export"
      - name: Read only the saved reference window and verify log coverage
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, time
          from pathlib import Path
          os.environ['TZ']='UTC';time.tzset()
          root=Path(os.environ['RUNNER_TEMP'])/'native-export'
          output=Path('SavedNativeLogEvidence')
          archives=sorted(root.rglob('*.logarchive'))
          assert archives, 'No original unified log archive was exported'
          assert len(archives)<=4, 'Unexpected diagnostic archive scope'
          predicate='process CONTAINS[c] "MTL" OR process CONTAINS[c] "metal" OR process CONTAINS[c] "AGX" OR subsystem CONTAINS[c] "metal" OR subsystem CONTAINS[c] "pencil" OR subsystem CONTAINS[c] "QuartzCore" OR subsystem CONTAINS[c] "CoreAnimation" OR (process == "Hashiya" AND subsystem != "com.apple.dt.xctest" AND (eventMessage CONTAINS[c] "error" OR eventMessage CONTAINS[c] "invalid" OR eventMessage CONTAINS[c] "failed")) OR ((process == "backboardd" OR process == "SpringBoard" OR process == "runningboardd") AND (eventMessage CONTAINS[c] "17358" OR eventMessage CONTAINS[c] "Hashiya"))'
          coverage='process == "Hashiya" AND eventMessage CONTAINS "Touches drawing"'
          reports=[]
          for index,archive in enumerate(archives):
              base=['/usr/bin/log','show','--archive',str(archive),'--start','2026-10-27 03:59:45','--end','2026-10-27 04:00:15','--style','compact','--info','--debug']
              selected=output/('failure-window-'+str(index)+'.log')
              with selected.open('w') as f:subprocess.run(base+['--predicate',predicate],stdout=f,stderr=subprocess.STDOUT,check=True,timeout=60)
              sample=output/('coverage-'+str(index)+'.log')
              with sample.open('w') as f:subprocess.run(base+['--predicate',coverage],stdout=f,stderr=subprocess.STDOUT,check=True,timeout=60)
              text=sample.read_text(errors='replace')
              confirmed=any('Touches drawing' in line and re.match(r'2026-10-27 04:00:',line) for line in text.splitlines())
              reports.append({'archive':str(archive.relative_to(root)),'window_start_utc':'2026-10-27T03:59:45Z','window_end_utc':'2026-10-27T04:00:15Z','case_result':'Passed original worker case once','case_has_failure':False,'coverage_confirmed':confirmed,'selected_bytes':selected.stat().st_size,'coverage_bytes':sample.stat().st_size})
          crashes=[str(p.relative_to(root)) for p in root.rglob('*.ips') if any(s in p.name.lower() for s in ['hashiya','metal','gpu','mtl'])]
          (output/'reader-report.json').write_text(json.dumps({'archives':reports,'relevant_crash_report_names':crashes,'timezone':time.tzname,'limits':'This archive is the passed94dcc worker reference, not the failed9fd1 source. Compare warnings/timing with the separately retained failure; no causal conclusion follows from presence or absence alone. Empty warnings require confirmed coverage. This is not a GPU command capture or a new test.'},indent=2)+'\n')
          assert any(r['coverage_confirmed'] for r in reports), 'Original stroke events were not found; do not infer absence of errors from an uncovered time window'
          print('Saved original stroke window covered. Native logs exported; no tests were executed.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Tayya-saved-94dcc-worker-native-log-evidence
          path: SavedNativeLogEvidence/
          retention-days: 30
