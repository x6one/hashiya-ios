name: Tayya Store artwork and approved publication
on:
  push:
    branches: [store/tayya-app-store-content]
    paths: [Store/publication.json, Store/metadata.json, Store/internal-qa.json, 'Store/Studio2/**', 'Tools/*testflight*.mjs', Tools/app_store_readiness.mjs, .github/workflows/tayya-store-listing.yml]
  workflow_dispatch:
    inputs:
      prepare_draft:
        description: Prepare only the authorized new Store version and its genuine branded screenshots
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: tayya-store-listing
  cancel-in-progress: false
jobs:
  inspect-build-number:
    if: ${{ github.event_name == 'push' && github.repository == 'x6one/hashiya-ios' && github.ref == 'refs/heads/store/tayya-app-store-content' && contains(github.event.head_commit.message, '[store:inspect-build]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify the existing build allocation contracts
        run: node Tools/test_testflight_candidate.mjs
      - name: Read current Apple build numbers without reserving or uploading a build
        env:
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: node Tools/testflight_candidate.mjs select OfficialBuildSelection.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Tayya-Official-Build-Selection-${{ github.run_id }}
          path: OfficialBuildSelection.json
          retention-days: 14
          if-no-files-found: warn
  complete-internal-qa:
    if: ${{ github.event_name == 'push' && github.repository == 'x6one/hashiya-ios' && github.ref == 'refs/heads/store/tayya-app-store-content' && contains(github.event.head_commit.message, '[store:complete-internal]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify the existing accepted QA source and small immutable Apple receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess, zipfile
          from pathlib import Path
          c=json.loads(Path('Store/internal-qa.json').read_text())
          assert c['complete_export_compliance'] is True
          assert isinstance(c.get('classification_only',False),bool)
          assert c['production_qualified'] is c['submit_for_review'] is c['public_release'] is False
          assert re.fullmatch('[a-f0-9]{40}',c['source']) and re.fullmatch('[a-f0-9]{40}',c['app_tree'])
          metadata=json.loads(subprocess.check_output(['gh','api',f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/artifacts/{c['state_artifact_id']}"],text=True))
          assert metadata['expired'] is False and metadata['name']==f"Tayya-TestFlight-QA-Apple-State-{c['run']}"
          assert metadata['workflow_run']['id']==c['run'] and metadata['workflow_run']['head_sha']==c['source']
          assert metadata['size_in_bytes']==c['state_artifact_bytes']<1024*1024
          assert metadata['digest']=='sha256:'+c['state_artifact_sha256']
          root=Path('InternalQA');root.mkdir();proof=root/'Proof';proof.mkdir()
          packed=root/'accepted-qa-receipt.zip'
          with packed.open('wb') as f:subprocess.run(['gh','api',f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/artifacts/{c['state_artifact_id']}/zip"],stdout=f,check=True)
          assert packed.stat().st_size==c['state_artifact_bytes']
          assert hashlib.sha256(packed.read_bytes()).hexdigest()==c['state_artifact_sha256']
          with zipfile.ZipFile(packed) as z:
              assert z.testzip() is None and sum(e.file_size for e in z.infolist())<1024*1024
              for e in z.infolist():
                  assert e.filename in ['apple-build-selection.json','apple-processing.json','internal-testing.json','provenance.json']
                  (proof/e.filename).write_bytes(z.read(e))
          baseline='c07e69eb49bea0588efb6c0f8d24c8b8e777c67c'
          subprocess.run(['git','fetch','--no-tags','--depth=1','origin',c['source'],baseline],check=True)
          git=lambda *a:subprocess.check_output(['git',*a],text=True).strip()
          assert git('rev-parse',c['source']+':App')==c['app_tree']
          assert not git('diff','--name-only',baseline,c['source'],'--','NativeOffice')
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('TAYYA_QA_BUILD='+c['build']+'\n')
              f.write('TAYYA_QA_INTERNAL_GROUP='+c['internal_group_id']+'\n')
              f.write('TAYYA_QA_CLASSIFICATION_ONLY='+str(c.get('classification_only',False)).lower()+'\n')
          PY
      - name: Verify QA continuation and original Store contracts before credentials
        run: |
          python3 -m unittest discover -s Tools -p 'test_*.py'
          node Tools/test_testflight_candidate.mjs
          node Tools/test_store_listing.mjs
          node Tools/test_store_presentation.mjs
          node Tools/test_submit_store_review.mjs
      - name: Verify or complete the approved encryption classification of the existing build
        env:
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          if [ "$TAYYA_QA_CLASSIFICATION_ONLY" = true ]; then
            node Tools/testflight_candidate.mjs classify InternalQA/export-compliance.json
          else
            node Tools/testflight_candidate.mjs complete InternalQA/export-compliance.json
          fi
      - name: Read actual TestFlight readiness and attach only an existing internal group
        if: env.TAYYA_QA_CLASSIFICATION_ONLY != 'true'
        env:
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          python3 - <<'PY'
          import json, subprocess, time
          from pathlib import Path
          deadline=time.monotonic()+300
          while time.monotonic()<deadline:
              check=subprocess.run(['node','Tools/testflight_candidate.mjs','status','InternalQA/apple-state.json'],timeout=90)
              state=json.loads(Path('InternalQA/apple-state.json').read_text())
              if check.returncode==0:break
              if not state.get('pending') and state.get('state')!='MISSING_EXPORT_COMPLIANCE':check.check_returncode()
              time.sleep(min(20,max(0,deadline-time.monotonic())))
          else:raise SystemExit('Keep the accepted build; actual beta availability is still pending, do not upload again')
          subprocess.run(['node','Tools/testflight_candidate.mjs','assign','InternalQA/internal-testing.json'],check=True,timeout=90)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Tayya-Internal-TestFlight-Availability
          path: InternalQA/
          if-no-files-found: warn
          retention-days: 14
  artwork:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[store:artwork]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Require the preserved native capture run and unchanged production code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          c=json.loads(Path('Store/publication.json').read_text())
          assert re.fullmatch('[a-f0-9]{40}',c['artwork_source']) and str(c['artwork_run']).isdigit()
          subprocess.run(['git','fetch','--no-tags','--depth=1','origin',c['artwork_source']],check=True)
          git=lambda *a:subprocess.check_output(['git',*a],text=True).strip()
          assert git('rev-parse','HEAD:App')==git('rev-parse',c['artwork_source']+':App')==c['app_tree']
          assert not git('diff','--name-only',c['artwork_source'],'HEAD','--','App','NativeOffice','project.yml')
          base=f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{c['artwork_run']}"
          run=json.loads(subprocess.check_output(['gh','api',base],text=True))
          jobs=json.loads(subprocess.check_output(['gh','api',base+'/jobs?per_page=100'],text=True))['jobs']
          assert run['conclusion']=='success' and run['head_sha']==c['artwork_source']
          assert run['name']=='Tayya Store readiness and actual medium-phone captures'
          required={'Native store capture (iPhone)','Native store capture (iPad)','artwork'}
          assert required<={j['name'] for j in jobs if j['conclusion']=='success'}
          Path('preserved-capture-jobs.json').write_text(json.dumps(jobs))
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('CAPTURE_RUN='+str(c['artwork_run'])+'\n')
          print('Reusing the two actual three-case capture results; no native test is rerun')
          PY
      - uses: actions/download-artifact@v4
        with:
          pattern: Tayya-Store-Original-*
          run-id: ${{ env.CAPTURE_RUN }}
          github-token: ${{ github.token }}
          path: NativeStoreCaptures
      - name: Use the existing artwork renderer
        run: |
          command -v chromium >/dev/null || command -v google-chrome >/dev/null
          python3 -c 'import PIL, playwright' || python3 -m pip install pillow playwright
          python3 - <<'PY'
          import hashlib, json, os, shutil, subprocess
          from pathlib import Path
          from Tools.collect_integration_captures import collect
          c=json.loads(Path('Store/publication.json').read_text())
          jobs=json.loads(Path('preserved-capture-jobs.json').read_text())
          for family,width,height,folder in [('iPhone',1206,2622,'iPhone-Medium'),('iPad',2064,2752,'iPad-13')]:
              job=next(j for j in jobs if j['name']==f'Native store capture ({family})')
              root=Path('NativeStoreCaptures')/('Tayya-Store-Original-'+family)
              rows=collect(root,c['artwork_source'],family,c['artwork_run'],job['id'])
              captures=Path('preserved-'+family+'.json');captures.write_text(json.dumps(rows,ensure_ascii=False))
              subprocess.run(['python3','Tools/render_store_artwork.py','--root',str(root),'--captures',str(captures),'--output','Tayya-App-Store-Visuals/'+folder,'--family',family,'--width',str(width),'--height',str(height)],check=True)
          out=Path('Tayya-App-Store-Visuals');images=[]
          for manifest in out.glob('*/store-artwork.json'):
              for row in json.loads(manifest.read_text()):
                  row['file']=str((manifest.parent/row['file']).relative_to(out));images.append(row)
          assert len(images)==12
          (out/'manifest.json').write_text(json.dumps({'source':c['artwork_source'],'run':str(c['artwork_run']),'render_run':os.environ['GITHUB_RUN_ID'],'renderer_source':os.environ['GITHUB_SHA'],'type':'Designed compositions from unchanged preserved native captures','images':images},ensure_ascii=False,indent=2)+'\n')
          (out/'index.html').write_text('<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>صور متجر طَيّة</title><style>body{background:#F8F7F3;color:#244C43;font:20px system-ui;margin:24px}a{display:inline-block;margin:12px}</style><h1>طَيّة — صور المتجر</h1><p>لقطات أصلية من التطبيق داخل تصميم بهوية طَيّة.</p><a href="iPhone-Medium/index.html">الآيفون</a><a href="iPad-13/index.html">الآيباد</a></html>')
          subprocess.run(['node','Tools/publish_store_listing.mjs','--config','Store/publication.json','--artwork',str(out),'--validate-only'],check=True)
          shutil.make_archive(str(out),'zip',out.parent,out.name)
          Path(str(out)+'.zip.sha256').write_text(hashlib.sha256(Path(str(out)+'.zip').read_bytes()).hexdigest()+'  '+str(out)+'.zip\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Tayya-App-Store-Designed-Screenshots
          path: |
            Tayya-App-Store-Visuals/
            Tayya-App-Store-Visuals.zip
            Tayya-App-Store-Visuals.zip.sha256
          retention-days: 14
  prepare:
    if: ${{ (github.event_name == 'push' && (contains(github.event.head_commit.message, '[store:listing]') || contains(github.event.head_commit.message, '[store:publish-approved]'))) || (github.event_name == 'workflow_dispatch' && inputs.prepare_draft) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Select the separately qualified application checkout
        run: |
          python3 - <<'PY_SOURCE'
          import json, os, re
          from pathlib import Path
          config=json.loads(Path('Store/publication.json').read_text())
          assert re.fullmatch('[a-f0-9]{40}',config['app_source'])
          with open(os.environ['GITHUB_ENV'],'a') as file:file.write('APP_SOURCE='+config['app_source']+'\n')
          PY_SOURCE
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_SOURCE }}
          path: hashiya-tools
      - name: Validate pinned qualification and native image sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          config=json.loads(Path('Store/publication.json').read_text())
          for key in ['app_source','artwork_source','app_tree']+(['renderer_source'] if 'render_run' in config else []):
              assert re.fullmatch('[a-f0-9]{40}',config[key]),key
          for key in ['qualified_run','artwork_run']+(['render_run'] if 'render_run' in config else []):
              assert str(config[key]).isdigit(),key
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          for key in ['app_source','artwork_source']+(['renderer_source'] if 'render_run' in config else []):
              subprocess.run(['git','fetch','--no-tags','--depth=1','origin',config[key]],check=True)
              expected=config['app_tree'] if key=='app_source' else config.get('artwork_app_tree',config['app_tree'])
              assert git('rev-parse',config[key]+':App')==expected,'Pinned application/artwork source tree differs'
          controller_base='bd126092c6b812c3ad2df9adecdd950e22d57b33'
          subprocess.run(['git','fetch','--no-tags','--depth=1','origin',controller_base],check=True)
          assert git('rev-parse','HEAD:App')==git('rev-parse',controller_base+':App'),'Store controller modified its unused App tree'
          assert git('-C','hashiya-tools','rev-parse','HEAD')==config['app_source']
          assert git('-C','hashiya-tools','rev-parse','HEAD:App')==config['app_tree']
          changed=git('diff','--name-only',controller_base,'HEAD').splitlines()
          store_tools={'Tools/testflight_candidate.mjs','Tools/test_testflight_candidate.mjs','Tools/app_store_readiness.mjs','Tools/publish_store_listing.mjs','Tools/test_store_listing.mjs','Tools/store_release.py','Tools/test_store_release.py','Tools/test_release_tools.py','Tools/submit_store_review.mjs','Tools/test_submit_store_review.mjs','Tools/test_store_presentation.mjs','.github/workflows/tayya-store-listing.yml'}
          assert all(path.startswith(('Store/','docs/','Verification/')) or path in store_tools for path in changed),'Only Store content and its isolated publisher may change; production/build/signing code stays frozen'
          assert not git('diff','--name-only',config['app_source'],config['artwork_source'],'--','NativeOffice'),'Photographed native engine differs from the qualified candidate'
          import yaml, sys
          sys.path.insert(0,'Tools')
          from store_release import verify_photographed_configuration
          verify_photographed_configuration(yaml.safe_load(git('show',config['app_source']+':project.yml')),
              yaml.safe_load(git('show',config['artwork_source']+':project.yml')),config,
              json.loads(Path('Store/encryption-classification-2026-10-28.json').read_text()))
          checks=[('qualified_run','app_source','iPhone and iPad preflight'),('artwork_run','artwork_source','Tayya Store readiness and actual medium-phone captures')]
          if 'render_run' in config:checks.append(('render_run','renderer_source','Tayya Store artwork and approved publication'))
          for key,source,name in checks:
              run=json.loads(subprocess.check_output(['gh','api',f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{config[key]}"],text=True))
              assert run['head_sha']==config[source] and run['name']==name and run['conclusion']=='success',run['html_url']
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('ARTWORK_RUN='+str(config.get('render_run',config['artwork_run']))+'\n')
          print('Exact application checkout and genuine artwork source qualified; differing presentation requires the separately recorded native-gallery review')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: Tayya-App-Store-Designed-Screenshots
          run-id: ${{ env.ARTWORK_RUN }}
          github-token: ${{ github.token }}
          path: StoreArtwork
      - name: Validate every image and raw screenshot before Apple writes
        run: |
          python3 -m unittest discover -s Tools -p test_store_release.py
          node Tools/test_store_listing.mjs
          node Tools/publish_store_listing.mjs --validate-only
      - name: Read the current Apple release and exact configured build state
        env:
          APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: node Tools/app_store_readiness.mjs store-apple-readiness.json
      - name: Prepare the new draft without modifying the published release
        env:
          GH_TOKEN: ${{ github.token }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: node Tools/publish_store_listing.mjs --application-path hashiya-tools
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Tayya-Store-draft-receipt
          path: |
            store-listing-report.json
            store-apple-readiness.json
          retention-days: 14
  publish:
    needs: prepare
    if: ${{ github.event_name == 'push' && github.repository == 'x6one/hashiya-ios' && github.ref == 'refs/heads/store/tayya-app-store-content' && contains(github.event.head_commit.message, '[store:publish-approved]') }}
    runs-on: macos-15
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Require the separately authorized immutable release
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          c=json.loads(Path('Store/publication.json').read_text())
          assert c.get('publish_binary') is True,'Binary publication is not enabled'
          assert re.fullmatch('[a-f0-9]{40}',c['app_source'])
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('APP_SOURCE='+c['app_source']+'\n')
              f.write('ARTWORK_RUN='+str(c.get('render_run',c['artwork_run']))+'\n')
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_SOURCE }}
          path: hashiya-tools
      - uses: actions/download-artifact@v4
        with:
          name: Tayya-Store-draft-receipt
          path: StoreDraft
      - uses: actions/download-artifact@v4
        with:
          name: Tayya-App-Store-Designed-Screenshots
          run-id: ${{ env.ARTWORK_RUN }}
          github-token: ${{ github.token }}
          path: StoreArtwork
      - name: Recheck every gate and consume only its exact native engine artifact
        run: |
          node Tools/publish_store_listing.mjs --qualify-only --application-path hashiya-tools
          python3 Tools/store_release.py source
          python3 Tools/store_release.py engine
      - name: Reuse the original device linkage and build tools
        run: |
          set -o pipefail
          command -v xcodegen >/dev/null || brew install xcodegen
          test -x "$(brew --prefix openssl@3)/bin/openssl" || brew install openssl@3
          if ! python3 -c 'import yaml'; then
            python3 -m venv "$RUNNER_TEMP/tayya-store-python"
            "$RUNNER_TEMP/tayya-store-python/bin/python" -m pip install PyYAML
            echo "$RUNNER_TEMP/tayya-store-python/bin" >> "$GITHUB_PATH"
            export PATH="$RUNNER_TEMP/tayya-store-python/bin:$PATH"
          fi
          python3 hashiya-tools/Tools/select_app_xcode.py
          python3 hashiya-tools/Tools/link_office_engine.py OfficeEngineCandidate diagnostics/link-probe
          cd hashiya-tools
          python3 Tools/prepare_native_office_app.py ../OfficeEngineCandidate ../diagnostics/link-probe project.yml
          xcodegen generate --spec NativeOfficeProject.yml
          xcodebuild -project Hashiya.xcodeproj -scheme Hashiya -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath NativeDeviceBuild CODE_SIGNING_ALLOWED=NO build 2>&1 | tee ../diagnostics/native-app-build.log
      - name: Verify the built source before credentials are provided
        run: python3 Tools/store_release.py source
      - name: Verify current Apple state before any binary upload
        env:
          APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          node Tools/app_store_readiness.mjs store-before-upload.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path('store-before-upload.json').read_text())
          config=json.loads(Path('Store/publication.json').read_text())
          assert state.get('ready_for_distribution_authentication') is True
          assert state.get('target_build')==str(config['build']), 'Apple response belongs to another target build'
          assert state.get('version_0_6_build_exists') is False,'Exact build already exists; inspect processing instead of attempting a duplicate upload'
          PY
      - name: Archive validate and upload with the unchanged native distribution helper
        working-directory: hashiya-tools
        env:
          APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: python3 Tools/distribute_native_app.py --preserve-archive
      - name: Attest the actual app checkout separately from the controller commit
        run: python3 Tools/store_release.py receipt
      - name: Retain only the verified accepted IPA and signed XCArchive
        run: |
          python3 - <<'PY_VERIFIED'
          import hashlib, json, os, plistlib, shutil, subprocess, zipfile
          from pathlib import Path
          root=Path('AppleDistribution')
          config=json.loads(Path('Store/publication.json').read_text())
          report=json.loads((root/'distribution-report.json').read_text())
          provenance=json.loads((root/'store-publication-provenance.json').read_text())
          assert all(report.get(k) is True for k in ['code_signed','upload_accepted','archive_retained'])
          assert provenance['application_source']==config['app_source'] and provenance['application_tree']==config['app_tree']
          assert provenance['controller_source']==os.environ['GITHUB_SHA'] and provenance['upload_accepted'] is True
          archive=root/'Tayya.xcarchive'
          app=archive/'Products/Applications/Hashiya.app'
          info=plistlib.loads((app/'Info.plist').read_bytes())
          assert (info['CFBundleIdentifier'],info['CFBundleShortVersionString'],str(info['CFBundleVersion']))==(config['bundle_id'],config['version'],str(config['build']))
          subprocess.run(['codesign','--verify','--deep','--strict',str(app)],check=True)
          subprocess.run(['xcrun','lipo','-verify_arch','arm64',str(app/info['CFBundleExecutable'])],check=True)
          def digest(path):
              with path.open('rb') as file:return hashlib.file_digest(file,'sha256').hexdigest()
          ipas=list((root/'Export').glob('*.ipa'))
          assert len(ipas)==1 and digest(ipas[0])==provenance['signed_ipa_sha256']==report['sha256']
          verified=root/'Verified'
          verified.mkdir()
          ipa=verified/'Tayya.ipa'
          shutil.copy2(ipas[0],ipa)
          assert digest(ipa)==provenance['signed_ipa_sha256']
          packed=verified/'Tayya.xcarchive.zip'
          subprocess.run(['ditto','-c','-k','--sequesterRsrc','--keepParent',str(archive),str(packed)],check=True)
          with zipfile.ZipFile(packed) as zipped:
              assert zipped.testzip() is None
              assert 'Tayya.xcarchive/Products/Applications/Hashiya.app/Info.plist' in zipped.namelist()
          provenance.update({'xcarchive_zip_sha256':digest(packed),'verified_artifacts':['Tayya.ipa','Tayya.xcarchive.zip']})
          (root/'store-publication-provenance.json').write_text(json.dumps(provenance,indent=2)+'\n')
          (verified/'SHA256SUMS').write_text(''.join(digest(p)+'  '+p.name+'\n' for p in [ipa,packed]))
          (verified/'release-provenance.json').write_text(json.dumps(provenance,indent=2)+'\n')
          PY_VERIFIED
      - name: Retain the small immutable upload receipt for read-only processing verification
        uses: actions/upload-artifact@v4
        with:
          name: Tayya-Apple-upload-receipt
          path: |
            AppleDistribution/store-publication-provenance.json
            StoreDraft/store-listing-report.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Tayya-approved-App-Store-upload
          path: |
            AppleDistribution/Verified/
            AppleDistribution/distribution-report.json
            AppleDistribution/store-publication-provenance.json
            store-engine-receipt.json
            store-before-upload.json
            diagnostics/link-probe/link-report.json
          retention-days: 14
  processing:
    needs: publish
    if: ${{ github.event_name == 'push' && github.repository == 'x6one/hashiya-ios' && github.ref == 'refs/heads/store/tayya-app-store-content' && contains(github.event.head_commit.message, '[store:publish-approved]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Tayya-Apple-upload-receipt
          path: .
      - name: Verify the same-run accepted upload before using Apple credentials
        run: python3 Tools/store_release.py processing-source
      - name: Confirm actual Apple processing without repeating the binary upload
        env:
          APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          python3 - <<'PY_PROCESSING'
          import subprocess, time
          deadline = time.monotonic() + 1200
          while True:
              remaining = deadline - time.monotonic()
              if remaining <= 0:
                  raise SystemExit('Apple build processing is still pending after20min; retain evidence, do not upload again')
              subprocess.run(['node', 'Tools/app_store_readiness.mjs', 'store-after-upload.json'],
                             check=True, timeout=min(100, remaining))
              check = subprocess.run(['python3', 'Tools/store_release.py', 'processing'])
              if check.returncode == 0:
                  break
              if check.returncode != 10:
                  check.check_returncode()
              time.sleep(min(20, max(0, deadline - time.monotonic())))
          PY_PROCESSING
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Tayya-Apple-processing-verification
          path: |
            store-after-upload.json
            store-processing-report.json
          retention-days: 14
  review:
    needs: processing
    if: ${{ github.event_name == 'push' && github.repository == 'x6one/hashiya-ios' && github.ref == 'refs/heads/store/tayya-app-store-content' && contains(github.event.head_commit.message, '[store:publish-approved]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Require explicit review and automatic-release authorization
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY_REVIEW_SOURCE'
          import json, os, re, subprocess
          from pathlib import Path
          c=json.loads(Path('Store/publication.json').read_text())
          assert c.get('publish_binary') is True and c.get('submit_for_review') is True and c.get('release_after_approval') is True
          assert re.fullmatch('[a-f0-9]{40}',c['app_source'])
          for key in ['app_source','artwork_source']:
              subprocess.run(['git','fetch','--no-tags','--depth=1','origin',c[key]],check=True)
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('APP_SOURCE='+c['app_source']+'\n')
              f.write('ARTWORK_RUN='+str(c.get('render_run',c['artwork_run']))+'\n')
          PY_REVIEW_SOURCE
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_SOURCE }}
          path: hashiya-tools
      - uses: actions/download-artifact@v4
        with:
          name: Tayya-Apple-upload-receipt
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: Tayya-Apple-processing-verification
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: Tayya-App-Store-Designed-Screenshots
          run-id: ${{ env.ARTWORK_RUN }}
          github-token: ${{ github.token }}
          path: StoreArtwork
      - name: Verify immutable accepted-upload provenance before Apple credentials
        run: python3 Tools/store_release.py processing-source
      - name: Verify Store and App Review orchestration before Apple credentials
        run: |
          node Tools/test_store_listing.mjs
          node Tools/test_store_presentation.mjs
          node Tools/test_submit_store_review.mjs
      - name: Submit the exact processed version and request release after approval
        env:
          GH_TOKEN: ${{ github.token }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          node Tools/publish_store_listing.mjs --submit-review --application-path hashiya-tools --report store-app-review-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Tayya-Apple-App-Review
          path: |
            store-app-review-report.json
            store-processing-report.json
            Store/presentation-compatibility.json
          if-no-files-found: warn
          retention-days: 14
