name: Tayya Studio design previews
on:
  push:
    branches: [design/tayya-studio-2]
    paths: ['DesignStudio/App/**', 'DesignStudio/Tests/**', 'DesignStudio/UITests/**', 'DesignStudio/project.yml', 'DesignStudio/.swiftlint.yml', 'DesignStudio/.swiftformat', '.github/workflows/tayya-studio-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: studio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: macos-15
    # The full 39-case design capture suite has a larger job budget; per-test limits stay 180/240s.
    timeout-minutes: ${{ contains(github.event.head_commit.message, '[studio:') && 25 || 35 }}
    strategy:
      fail-fast: false
      matrix:
        family: ${{ fromJSON(contains(github.event.head_commit.message, '[studio:incarnation-red]') && '["iPad"]' || contains(github.event.head_commit.message, '[studio:compact-') && '["iPhone"]' || contains(github.event.head_commit.message, '[studio:save-probe]') && '["iPhone"]' || contains(github.event.head_commit.message, '[studio:page-jump]') && '["iPad"]' || contains(github.event.head_commit.message, '[studio:review-red]') && '["iPad"]' || contains(github.event.head_commit.message, '[studio:red]') && '["iPhone"]' || '["iPhone","iPad"]') }}
    defaults:
      run:
        working-directory: DesignStudio
    steps:
      - uses: actions/checkout@v4
      - name: Select toolchain and audit existing tools
        run: |
          python3 ../Tools/select_app_xcode.py
          for tool in xcodegen swiftlint swiftformat; do
            if ! command -v "$tool" >/dev/null; then brew install "$tool"; fi
            "$tool" --version
          done
      - name: Check formatting and lint only preview Swift
        run: |
          swiftformat App Tests UITests --lint --config .swiftformat
          swiftlint lint --strict --config .swiftlint.yml App Tests UITests
      - name: Generate isolated preview project and choose simulator
        env:
          DEVICE_FAMILY: ${{ matrix.family }}
        run: |
          xcodegen generate
          python3 - <<'PY'
          import json, os, re, subprocess
          devices = json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','--json']))['devices']
          family = os.environ['DEVICE_FAMILY']
          choices = [(tuple(map(int,re.findall(r'\d+',runtime))), d) for runtime, rows in devices.items() if 'iOS' in runtime for d in rows if d['name'].startswith(family)]
          # Small phone exposes crowding; 11-inch tablet exposes split constraints.
          choices.sort(key=lambda x:(x[0], ('Pro' in x[1]['name'] and 'Max' not in x[1]['name']) if family=='iPhone' else '11' in x[1]['name']), reverse=True)
          if not choices: raise SystemExit('Required simulator unavailable')
          picked = choices[0][1]
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('SIMULATOR_ID='+picked['udid']+'\n')
          print(picked['name'],picked['udid'])
          subprocess.run(['xcrun','simctl','boot',picked['udid']],check=False)
          subprocess.run(['xcrun','simctl','bootstatus',picked['udid'],'-b'],check=True)
          subprocess.run(['xcrun','simctl','status_bar',picked['udid'],'override','--time','9:41','--batteryState','charged','--batteryLevel','100'],check=True)
          PY
      - name: Test prototype contracts and capture real SwiftUI
        env:
          RED_PROBE: ${{ contains(github.event.head_commit.message, '[studio:red]') }}
          REMAINING_ONLY: ${{ contains(github.event.head_commit.message, '[studio:remaining]') }}
          TARGET_FAMILY: ${{ matrix.family }}
          COMPACT_ONLY: ${{ contains(github.event.head_commit.message, '[studio:compact-') }}
          COMPACT_GREEN: ${{ contains(github.event.head_commit.message, '[studio:compact-fix]') }}
          CAPTURE_ONLY: ${{ contains(github.event.head_commit.message, '[studio:capture]') }}
          PAGE_JUMP_ONLY: ${{ contains(github.event.head_commit.message, '[studio:page-jump]') }}
          FINISH_FIXES: ${{ contains(github.event.head_commit.message, '[studio:finish-fixes]') }}
          SAVE_PROBE: ${{ contains(github.event.head_commit.message, '[studio:save-probe]') }}
          REVIEW_RED: ${{ contains(github.event.head_commit.message, '[studio:review-red]') }}
          POLISH_ONLY: ${{ contains(github.event.head_commit.message, '[studio:polish]') }}
          POLISH_RED: ${{ contains(github.event.head_commit.message, '[studio:polish-red]') }}
          ACCESSIBLE_LAYOUT_ONLY: ${{ contains(github.event.head_commit.message, '[studio:layout]') }}
          APPROVAL_ONLY: ${{ contains(github.event.head_commit.message, '[studio:approval') }}
          APPROVAL_GREEN: ${{ contains(github.event.head_commit.message, '[studio:approval]') }}
          INCARNATION_RED: ${{ contains(github.event.head_commit.message, '[studio:incarnation-red]') }}
        run: |
          set -o pipefail
          options=()
          if [ "$INCARNATION_RED" = true ]; then
            options+=('-only-testing:StudioTests/StudioApprovalTests/testReinsertedEditedPageNeverReusesAnEarlierRenderKey')
            options+=('-only-testing:StudioTests/StudioApprovalTests/testReviewPDFContainsDistinctTextTableImageInkAndBlankPages')
          fi
          if [ "$APPROVAL_ONLY" = true ]; then
            options+=('-only-testing:StudioTests/StudioApprovalTests')
            options+=('-only-testing:StudioUITests/StudioCaptureTests/testApprovalExtremeTypeCoreToolsFitWithoutOverlappingLabels')
          fi
          if [ "$APPROVAL_GREEN" = true ]; then
            options+=('-only-testing:StudioTests/StudioVisualContractTests/testSFSymbolsResolveInActualRuntime')
            options+=('-only-testing:StudioTests/StudioVisualContractTests/testPreviewPDFContainsRealSelectableContentAndAllPages')
            options+=('-only-testing:StudioUITests/StudioCaptureTests/testApprovalContextChangesKeepPDFFrameAndInkSettings')
            options+=('-only-testing:StudioTests/StudioPolishTests/testPDFViewportSurvivesChromeAndNotesSizeChanges')
            options+=('-only-testing:StudioUITests/StudioCaptureTests/testPolishContextToolsAndCompactAudio')
            options+=('-only-testing:StudioUITests/StudioCaptureTests/testPolishPickerUsesRealPageThumbnails')
            options+=('-only-testing:StudioUITests/StudioCaptureTests/testPolishExtremeTypeAndLandscapeCaptures')
            options+=('-only-testing:StudioUITests/StudioCaptureTests/testCompactAccessibleDocumentUsesReversibleFocus')
            options+=('-only-testing:StudioUITests/StudioCaptureTests/testAccessibleEditorLabelsStayWhole')
          fi
          if [ "$CAPTURE_ONLY" = true ]; then
            # Re-capture after an XCTest screenshot-only repair, reusing the39/39 gate
            # at6d513cfc. Fail if app, unit tests or project differ from that evidence.
            test "$(git rev-parse HEAD:DesignStudio/App)" = 4c6b0f69fcbf4bc081b5cf0599fb451c5dcce25d
            test "$(git rev-parse HEAD:DesignStudio/Tests)" = 182ffdd4cbe8edcd51dc6c230f13ba67b38d1da8
            test "$(git rev-parse HEAD:DesignStudio/project.yml)" = 7f2e93b86769d1e086f8c562c63e3c32d606f357
            for test in testCapturePrimaryScenesLight testCapturePrimaryScenesDark testEnglishAndAccessibilityLayouts testFinalPolishExpandedNotesAndFocusCaptures testPolishExtremeTypeAndLandscapeCaptures testCompactAccessibleDocumentUsesReversibleFocus testPolishContextToolsAndCompactAudio testPolishAccessibleNotesHaveReadableWidth testPolishPickerUsesRealPageThumbnails testPolishMarkerKeepsClosedNotesClosed testPolishDraftAndThreePenPresetsSurviveRelaunch testPolishLargeLibraryFiltersStayWhole; do options+=("-only-testing:StudioUITests/StudioCaptureTests/$test"); done
          fi
          if [ "$POLISH_RED" = true ] || [ "$POLISH_ONLY" = true ]; then
            for test in testPolishNotesDisplayCopy testPolishContextToolsAndCompactAudio testPolishAccessibleNotesHaveReadableWidth testPolishPickerUsesRealPageThumbnails testPolishLargeLibraryFiltersStayWhole testPolishDraftAndThreePenPresetsSurviveRelaunch testPolishDirectPageJumpAndLastVisitedPage; do options+=("-only-testing:StudioUITests/StudioCaptureTests/$test"); done
          fi
          if [ "$POLISH_ONLY" = true ]; then
            options+=('-only-testing:StudioUITests/StudioCaptureTests/testReviewAccessibleDocumentChoiceSurvivesMarkerReturn')
            options+=('-only-testing:StudioTests/StudioPolishTests')
            options+=('-only-testing:StudioTests/StudioReviewRegressionTests')
            options+=('-only-testing:StudioTests/StudioVisualContractTests')
            options+=('-only-testing:StudioUITests/StudioCaptureTests/testReviewTextTargetFollowsVisibleSurface')
            options+=('-only-testing:StudioUITests/StudioCaptureTests/testReviewExpandedNotesLayoutSurvivesMarkerReturn')
            options+=('-only-testing:StudioUITests/StudioCaptureTests/testRecordingNavigationMarkersAndFocusStayIndependent')
            options+=('-only-testing:StudioUITests/StudioCaptureTests/testNonzeroMarkerSeeksAndReturnsToItsPage')
            options+=('-only-testing:StudioUITests/StudioCaptureTests/testAccessibleEditorLabelsStayWhole')
            options+=('-only-testing:StudioUITests/StudioCaptureTests/testPolishMarkerKeepsClosedNotesClosed')
          fi
          if [ "$REVIEW_RED" = true ]; then
            options+=('-only-testing:StudioTests/StudioPolishTests')
            options+=('-only-testing:StudioTests/StudioReviewRegressionTests')
            options+=('-only-testing:StudioUITests/StudioCaptureTests/testReviewTextTargetFollowsVisibleSurface')
            options+=('-only-testing:StudioUITests/StudioCaptureTests/testReviewExpandedNotesLayoutSurvivesMarkerReturn')
          fi
          if [ "$SAVE_PROBE" = true ]; then
            options+=('-only-testing:StudioTests/StudioPolishTests')
            options+=('-only-testing:StudioUITests/StudioCaptureTests/testPolishDraftAndThreePenPresetsSurviveRelaunch')
            options+=('-only-testing:StudioUITests/StudioCaptureTests/testPolishPickerUsesRealPageThumbnails')
          fi
          if [ "$COMPACT_ONLY" = true ]; then options+=('-only-testing:StudioUITests/StudioCaptureTests/testCompactAccessibleDocumentUsesReversibleFocus'); fi
          if [ "$COMPACT_GREEN" = true ]; then
            options+=('-only-testing:StudioTests/StudioPolishTests/testPDFViewportSurvivesChromeAndNotesSizeChanges')
            options+=('-only-testing:StudioUITests/StudioCaptureTests/testPolishExtremeTypeAndLandscapeCaptures')
          fi
          if [ "$PAGE_JUMP_ONLY" = true ]; then options+=('-only-testing:StudioUITests/StudioCaptureTests/testPolishDirectPageJumpAndLastVisitedPage'); fi
          if [ "$FINISH_FIXES" = true ]; then
            options+=('-only-testing:StudioTests/StudioPolishTests/testPDFViewportSurvivesChromeAndNotesSizeChanges')
            options+=('-only-testing:StudioTests/StudioPolishTests/testPreviewDraftRoundTripsNotesDrawingAndThreeEditablePens')
            options+=('-only-testing:StudioUITests/StudioCaptureTests/testPolishDraftAndThreePenPresetsSurviveRelaunch')
            if [ "$TARGET_FAMILY" = iPad ]; then
              options+=('-only-testing:StudioUITests/StudioCaptureTests/testPolishDirectPageJumpAndLastVisitedPage')
              options+=('-only-testing:StudioUITests/StudioCaptureTests/testRecordingNavigationMarkersAndFocusStayIndependent')
              options+=('-only-testing:StudioUITests/StudioCaptureTests/testPolishPickerUsesRealPageThumbnails')
            fi
          fi
          if [ "$RED_PROBE" = true ]; then options+=('-only-testing:StudioTests/StudioSessionTests'); fi
          if [ "$REMAINING_ONLY" = true ]; then
            options+=('-only-testing:StudioTests/StudioVisualContractTests/testPreviewPDFContainsRealSelectableContentAndAllPages')
            options+=('-only-testing:StudioUITests/StudioCaptureTests/testNonzeroMarkerSeeksAndReturnsToItsPage')
            options+=('-only-testing:StudioUITests/StudioCaptureTests/testRecordingNavigationMarkersAndFocusStayIndependent')
            options+=('-only-testing:StudioUITests/StudioCaptureTests/testUpdatedDocumentTextRendering')
          fi
          if [ "$ACCESSIBLE_LAYOUT_ONLY" = true ]; then options+=('-only-testing:StudioUITests/StudioCaptureTests/testAccessibleEditorLabelsStayWhole'); fi
          xcodebuild test -project TayyaStudio.xcodeproj -scheme TayyaStudio -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath "$RUNNER_TEMP/StudioBuild" -resultBundlePath Studio.xcresult -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 240 "${options[@]}" CODE_SIGNING_ALLOWED=NO 2>&1 | tee studio-build.log
      - name: Export actual images and source manifest
        if: always()
        env:
          FAMILY: ${{ matrix.family }}
        run: |
          mkdir -p Evidence/Screenshots
          if [ -d Studio.xcresult ]; then
            xcrun xcresulttool get test-results summary --path Studio.xcresult > Evidence/summary.json
            xcrun xcresulttool export attachments --path Studio.xcresult --output-path Evidence/Screenshots
            ditto -c -k --keepParent Studio.xcresult Evidence/Studio.xcresult.zip
          fi
          python3 - <<'PY'
          import json,os,pathlib,hashlib
          p=pathlib.Path('Evidence'); files=[]
          for f in sorted(p.rglob('*.png')):
            files.append({'file':str(f.relative_to(p)), 'sha256':hashlib.sha256(f.read_bytes()).hexdigest()})
          (p/'source.json').write_text(json.dumps({'source':os.environ['GITHUB_SHA'],'family':os.environ['FAMILY'],'type':'Actual SwiftUI prototype simulator captures; production UI not changed','images':files},indent=2))
          PY
          cp studio-build.log Evidence/ || true
          xcrun simctl spawn "$SIMULATOR_ID" log show --last 15m --predicate 'eventMessage BEGINSWITH "StudioDraft" OR eventMessage BEGINSWITH "StudioCanvas" OR eventMessage BEGINSWITH "StudioPage"' --style compact > Evidence/draft-io.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Tayya-Studio-2-${{ matrix.family }}
          path: DesignStudio/Evidence/
          retention-days: 14
