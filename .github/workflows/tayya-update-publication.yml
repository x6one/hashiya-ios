name: Tayya update publication
on:
  push:
    branches: ['release/tayya-0.6.2-controller']
    paths: ['.github/workflows/tayya-update-publication.yml', 'Store/update-qualified-source.json']
permissions:
  contents: read
jobs:
  readiness:
    if: contains(github.event.head_commit.message, '[store:readiness]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Read existing Apple application, versions and build numbers
        env:
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          node --input-type=module <<'JS'
          import {writeFileSync} from 'node:fs';
          import {createAppleClient} from './Tools/app_store_readiness.mjs';
          const report={app_id:'6818288428',bundle_id:'com.ahmadalawi.hashiya',target_version:'0.6.2',read_only:true,source:process.env.GITHUB_SHA};
          try {
            const {get}=createAppleClient();
            const app=(await get('apps/6818288428')).data;
            if(app.attributes.bundleId!==report.bundle_id)throw new Error('Unexpected application identity');
            report.application={id:app.id,name:app.attributes.name,bundle_id:app.attributes.bundleId};
            const versions=(await get('apps/6818288428/appStoreVersions?filter[platform]=IOS&limit=200')).data;
            report.versions=versions.map(v=>({id:v.id,version:v.attributes.versionString,state:v.attributes.appStoreState,release_type:v.attributes.releaseType}));
            const infos=await get('apps/6818288428/appInfos?limit=200');
            if(infos.links?.next)throw new Error('Unexpected application-info pagination');
            report.app_infos=[];
            for(const info of infos.data) {
              const localizations=await get('appInfos/'+info.id+'/appInfoLocalizations?limit=200');
              if(localizations.links?.next)throw new Error('Unexpected localization pagination');
              report.app_infos.push({id:info.id,state:info.attributes.state||info.attributes.appStoreState,localizations:localizations.data.map(row=>({locale:row.attributes.locale,name:row.attributes.name,subtitle:row.attributes.subtitle,privacy_policy_url:row.attributes.privacyPolicyUrl}))});
            }
            let next='builds?filter[app]=6818288428&include=preReleaseVersion&sort=-uploadedDate&limit=200';
            report.builds=[];
            for(let page=0;next && page<10;page++) {
              const response=await get(next);
              const trains=new Map((response.included||[]).map(v=>[v.id,v.attributes.version]));
              report.builds.push(...response.data.map(b=>({id:b.id,build:b.attributes.version,version:trains.get(b.relationships?.preReleaseVersion?.data?.id)||null,processing:b.attributes.processingState,expired:b.attributes.expired})));
              next=response.links?.next;
            }
            if(next)throw new Error('Build enumeration exceeded the bounded pagination limit');
            if(report.builds.some(b=>!/^\d+$/.test(b.build)))throw new Error('A noninteger build requires an explicit version policy');
            report.next_unused_build=String(Math.max(0,...report.builds.map(b=>Number(b.build)))+1);
            report.authenticated_read_succeeded=true;
          }catch(error) {
            report.error=/^(Apple API |Unexpected application|Build enumeration|A noninteger)/.test(error.message)?error.message:'Apple authentication/read failed; private credential values are not logged';
            process.exitCode=1;
          }finally{writeFileSync('tayya-update-readiness.json',JSON.stringify(report,null,2)+'\n');console.log(JSON.stringify(report));}
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tayya-update-apple-readiness
          path: tayya-update-readiness.json
          if-no-files-found: error
          retention-days: 30
  prepare-update-draft:
    if: contains(github.event.head_commit.message, '[store:prepare-version]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Prepare only the authorized editable update; preserve the published app
        env:
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          node --input-type=module <<'JS'
          import {writeFileSync} from 'node:fs';
          import {createAppleClient} from './Tools/app_store_readiness.mjs';
          const report={app_id:'6818288428',bundle_id:'com.ahmadalawi.hashiya',version:'0.6.2',draft_only:true,binary_uploaded:false,submitted_for_review:false};
          try {
            const api=createAppleClient();
            const app=(await api.get('apps/6818288428')).data;
            if(app.attributes.bundleId!==report.bundle_id)throw new Error('Unexpected app identity');
            const response=await api.get('apps/6818288428/appStoreVersions?filter[platform]=IOS&limit=200');
            if(response.links?.next)throw new Error('Unexpected version pagination');
            let version=response.data.find(row=>row.attributes.versionString==='0.6.2');
            const live=response.data.find(row=>row.attributes.versionString==='0.6.1');
            if(!live||!['READY_FOR_SALE','READY_FOR_DISTRIBUTION'].includes(live.attributes.appVersionState||live.attributes.appStoreState))throw new Error('Published source version differs; preserve Apple state');
            report.published_version_preserved='0.6.1';
            if(!version) {
              version=(await api.post('appStoreVersions',{data:{type:'appStoreVersions',attributes:{platform:'IOS',versionString:'0.6.2',releaseType:'AFTER_APPROVAL',copyright:live.attributes.copyright||'2026 Ahmad Alawi'},relationships:{app:{data:{type:'apps',id:'6818288428'}}}}})).data;
              report.created=true;
            }
            report.app_store_version_id=version.id;
            report.version_state=version.attributes.appVersionState||version.attributes.appStoreState;
            report.release_type=version.attributes.releaseType;
          }catch(error) {
            report.error=error.status?'Apple API HTTP '+error.status:'Update draft preparation failed';
            report.operation=error.operation;
            report.apple_errors=error.apple_errors;
            process.exitCode=1;
          }finally{writeFileSync('tayya-update-draft.json',JSON.stringify(report,null,2)+'\n');console.log(JSON.stringify(report));}
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tayya-update-draft-authority
          path: tayya-update-draft.json
          if-no-files-found: error
          retention-days: 30
  await-qualified-source:
    if: github.repository == 'x6one/hashiya-ios' && contains(github.event.head_commit.message, '[store:dispatch-qualified]')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Wait only for the existing pinned release run; never rerun a test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS_WAIT_GATES'
          import {readFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import assert from 'node:assert/strict';
          import {validateQualification} from './Tools/publish_store_listing.mjs';
          const c=JSON.parse(readFileSync('Store/update-qualified-source.json','utf8'));
          assert.match(c.app_source,/^[a-f0-9]{40}$/);
          assert.match(String(c.qualified_run),/^\d+$/);assert.match(String(c.artwork_run),/^\d+$/);
          const get=path=>JSON.parse(execFileSync('gh',['api','repos/x6one/hashiya-ios/'+path],{encoding:'utf8'}));
          const deadline=Date.now()+170*60*1000;let previous='';
          while(true){
            let ready=true;const states=[];
            for(const [id,kind] of [[c.qualified_run,'release'],[c.artwork_run,'artwork']]){
              const run=get('actions/runs/'+id),jobs=get('actions/runs/'+id+'/jobs?per_page=100');
              assert.equal(run.head_sha,c.app_source,'Do not wait for another application source');
              if(jobs.total_count>jobs.jobs.length)throw new Error('Gate job listing is incomplete');
              const failed=jobs.jobs.filter(j=>j.status==='completed'&&['failure','cancelled','timed_out','action_required','startup_failure'].includes(j.conclusion));
              if(failed.length)throw new Error('Pinned gate failed; no build/sign/upload: '+failed.map(j=>j.name+':'+j.conclusion).join(','));
              states.push(kind+':'+run.status+':'+(run.conclusion||'pending')+':'+jobs.jobs.filter(j=>j.conclusion==='success').length+' passed jobs');
              if(run.status==='completed')validateQualification(run,jobs.jobs,c.app_source,kind);
              else ready=false;
            }
            const status=states.join(' | ');if(status!==previous){console.log(new Date().toISOString(),status);previous=status;}
            if(ready){console.log('Every pinned native, Maestro/export, gallery, Office and artwork gate passed; signing may now be considered');break;}
            if(Date.now()>=deadline)throw new Error('Pinned verification remains incomplete; no signing or upload was dispatched');
            await new Promise(resolve=>setTimeout(resolve,45000));
          }
          JS_WAIT_GATES
  dispatch-qualified-archive:
    needs: await-qualified-source
    concurrency:
      group: tayya-update-qualified-signing
      cancel-in-progress: false
    if: github.repository == 'x6one/hashiya-ios' && contains(github.event.head_commit.message, '[store:dispatch-qualified]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify archive handoff guards without external writes
        run: node Tools/test_qualified_archive_dispatch.mjs
      - name: Require every exact-source release gate before the official signed build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS_DISPATCH'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import assert from 'node:assert/strict';
          import {validateQualification} from './Tools/publish_store_listing.mjs';
          const c=JSON.parse(readFileSync('Store/update-qualified-source.json','utf8'));
          assert.equal(c.app_id,'6818288428');assert.equal(c.bundle_id,'com.ahmadalawi.hashiya');
          assert.equal(c.version,'0.6.2');assert.equal(String(c.build),'17');
          assert.equal(c.publish_binary,true);
          assert.equal(c.app_ref,'integration/tayya-precision-ink');assert.match(c.app_source,/^[a-f0-9]{40}$/);
          assert.match(String(c.qualified_run),/^\d+$/);assert.match(String(c.artwork_run),/^\d+$/);
          const get=path=>JSON.parse(execFileSync('gh',['api','repos/x6one/hashiya-ios/'+path],{encoding:'utf8'}));
          const run=get('actions/runs/'+c.qualified_run),jobs=get('actions/runs/'+c.qualified_run+'/jobs?per_page=100');
          assert.equal(run.event,'push');
          if(jobs.total_count>jobs.jobs.length)throw new Error('Qualification job listing must be complete');
          validateQualification(run,jobs.jobs,c.app_source,'release');
          const artwork=get('actions/runs/'+c.artwork_run),artworkJobs=get('actions/runs/'+c.artwork_run+'/jobs?per_page=100');
          if(artworkJobs.total_count>artworkJobs.jobs.length)throw new Error('Artwork job listing must be complete');
          validateQualification(artwork,artworkJobs.jobs,c.app_source,'artwork');
          const ref=get('git/ref/heads/'+c.app_ref);assert.equal(ref.object.sha,c.app_source,'The application branch must remain frozen');
          const spec=get('contents/project.yml?ref='+c.app_source);
          const project=Buffer.from(spec.content,'base64').toString('utf8');
          assert.match(project,/MARKETING_VERSION: '0\.6\.2'/);assert.match(project,/CURRENT_PROJECT_VERSION: '17'/);
          const previous=get('actions/workflows/office-engine-spike.yml/runs?event=workflow_dispatch&head_sha='+c.app_source+'&per_page=100');
          assert.equal(previous.total_count,0,'A signed dispatch already exists for this source; inspect it instead of dispatching again');
          execFileSync('gh',['api','--method','POST','repos/x6one/hashiya-ios/actions/workflows/office-engine-spike.yml/dispatches','-f','ref='+c.app_ref,'-f','inputs[expected_source]='+c.app_source,'-f','inputs[publish_to_apple]=true','-f','inputs[sign_archive]=false'],{stdio:'inherit'});
          writeFileSync('tayya-qualified-dispatch.json',JSON.stringify({source:c.app_source,qualified_run:c.qualified_run,version:c.version,build:c.build,official_workflow:'office-engine-spike.yml',dispatch_accepted:true,upload_confirmed:false},null,2)+'\n');
          JS_DISPATCH
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tayya-qualified-archive-dispatch
          path: tayya-qualified-dispatch.json
          if-no-files-found: warn
          retention-days: 30
