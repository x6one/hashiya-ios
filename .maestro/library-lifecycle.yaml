    element:
      id: notebookActions-QA Notebook
    direction: DOWN
    visibilityPercentage: 100
    centerElement: true
- tapOn:
    id: notebookActions-QA Notebook
- tapOn:
    id: renameNotebook-QA Notebook
- tapOn:
    text: QA Notebook
- eraseText
- inputText: QA Renamed
- tapOn: حفظ
- assertVisible:
    id: openNotebook-QA Renamed
# Center the real menu above the fixed destination dock before tapping.
- scrollUntilVisible:
    element:
