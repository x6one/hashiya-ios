    index: 0
- tapOn:
    id: sectionName
- inputText: QA Section
- tapOn:
    id: addSection
- assertVisible: QA Section
- tapOn: تم
# Center the real menu above the fixed destination dock before tapping.
- scrollUntilVisible:
    element:
      id: notebookActions-QA Notebook
    direction: DOWN
    visibilityPercentage: 100
    centerElement: true
- tapOn:
    id: notebookActions-QA Notebook
- tapOn:
    id: moveNotebook-QA Notebook
- tapOn: QA Section
- assertNotVisible:
    id: openNotebook-QA Notebook
- assertNotVisible:
    id: continueNotebook
- tapOn:
    id: librarySections
    index: 0
- tapOn:
