name: NativeInkControl
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.9'
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  NativeInkControl:
    type: application
    platform: iOS
    sources:
      - ControlApp.swift
      - ProductionNotesControl.swift
      - ../../App/MarginNotebook.swift
      - ../../App/MarginPages.swift
      - ../../App/TayyaTheme.swift
      - ../../App/TayyaComponents.swift
      - ../../App/TayyaLocalization.swift
      - ../../App/TayyaMotion.swift
      - ../../App/DebugVisualEnvironment.swift
      - ../../App/InkToolbarScrollView.swift
      - ../../App/PenPresets.swift
      - ../../App/NativeInkInspection.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ahmadalawi.hashiya.native-ink-control
    info:
      path: Generated-Control-Info.plist
      properties:
        CFBundleDisplayName: Native Ink Diagnostic
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
  NativeInkControlTests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ControlTests.swift]
    dependencies:
      - target: NativeInkControl
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ahmadalawi.hashiya.native-ink-control-tests
        GENERATE_INFOPLIST_FILE: true
schemes:
  NativeInkControl:
    build:
      targets:
        NativeInkControl: all
    test:
      targets: [NativeInkControlTests]
