name: Hashiya
options:
  bundleIdPrefix: com.ahmadalawi
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '0.4.1'
    CURRENT_PROJECT_VERSION: '9'
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    revision: 02b6abe5f6eef7e3cbd5f247c5cc24e246efcfe0
targets:
  Hashiya:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: ZIPFoundation
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: طَيّة
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSMicrophoneUsageDescription: تسجيل ملاحظاتك الصوتية وربطها بصفحات الدراسة.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Study Documents
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf, org.openxmlformats.presentationml.presentation, com.microsoft.powerpoint.ppt, org.openxmlformats.wordprocessingml.document, com.microsoft.word.doc, org.openxmlformats.spreadsheetml.sheet, com.microsoft.excel.xls]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ahmadalawi.hashiya
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  HashiyaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Hashiya
  HashiyaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Hashiya
schemes:
  Hashiya:
    build:
      targets:
        Hashiya: all
    test:
      targets: [HashiyaTests, HashiyaUITests]
